<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YCDesk Server - 信令服务器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 5px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .content {
            padding: 30px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-bottom: 25px;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            transition: all 0.3s;
        }

        .status-dot.running {
            background: #28a745;
            box-shadow: 0 0 10px #28a745;
        }

        .status-text {
            font-weight: 600;
            color: #495057;
        }

        .config-section {
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e9ecef;
        }

        .mode-selector {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .mode-card {
            flex: 1;
            padding: 20px;
            border: 2px solid #e9ecef;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9fa;
        }

        .mode-card:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .mode-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, rgba(102,126,234,0.1) 0%, rgba(118,75,162,0.1) 100%);
        }

        .mode-card h3 {
            font-size: 18px;
            margin-bottom: 8px;
            color: #333;
        }

        .mode-card p {
            font-size: 13px;
            color: #666;
            line-height: 1.5;
        }

        .mode-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .badge-warning {
            background: #fff3cd;
            color: #856404;
        }

        .badge-success {
            background: #d4edda;
            color: #155724;
        }

        .cert-config {
            display: none;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
            margin-top: 15px;
        }

        .cert-config.show {
            display: block;
        }

        .input-group {
            margin-bottom: 15px;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #495057;
            margin-bottom: 6px;
        }

        .file-input-wrapper {
            display: flex;
            gap: 10px;
        }

        .file-input-wrapper input[type="text"] {
            flex: 1;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 13px;
            transition: all 0.3s;
        }

        .file-input-wrapper input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .port-input {
            width: 150px;
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 14px;
        }

        .action-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            padding-top: 10px;
        }

        .log-section {
            margin-top: 25px;
        }

        .log-box {
            background: #1e1e1e;
            border-radius: 10px;
            padding: 15px;
            height: 300px;
            overflow-y: auto;
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 12px;
            line-height: 1.6;
        }

        .log-entry {
            margin-bottom: 4px;
            padding: 4px 0;
        }

        .log-timestamp {
            color: #888;
            margin-right: 8px;
        }

        .log-type-info {
            color: #61afef;
        }

        .log-type-warning {
            color: #d19a66;
        }

        .log-type-error {
            color: #e06c75;
        }

        .log-type-stdout {
            color: #98c379;
        }

        .log-type-stderr {
            color: #e06c75;
        }

        .log-box::-webkit-scrollbar {
            width: 8px;
        }

        .log-box::-webkit-scrollbar-track {
            background: #2d2d2d;
            border-radius: 4px;
        }

        .log-box::-webkit-scrollbar-thumb {
            background: #555;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>YCDesk Server</h1>
            <p>信令服务器管理工具</p>
        </div>

        <div class="content">
            <div class="status-bar">
                <div class="status-indicator">
                    <div class="status-dot" id="statusDot"></div>
                    <span class="status-text" id="statusText">未启动</span>
                </div>
            </div>

            <div class="config-section">
                <div class="section-title">启动模式</div>
                <div class="mode-selector">
                    <div class="mode-card selected" data-mode="http" id="modeHttp">
                        <span class="mode-badge badge-warning">推荐</span>
                        <h3>HTTP / WS</h3>
                        <p>无需证书，简单快速<br>适合局域网和测试环境</p>
                    </div>
                    <div class="mode-card" data-mode="https" id="modeHttps">
                        <span class="mode-badge badge-success">安全</span>
                        <h3>HTTPS / WSS</h3>
                        <p>需要 SSL 证书<br>适合公网和生产环境</p>
                    </div>
                </div>

                <div class="cert-config" id="certConfig">
                    <div class="input-group">
                        <label>证书文件</label>
                        <div class="file-input-wrapper">
                            <input type="text" id="certPath" readonly placeholder="选择证书文件 (.crt, .pem)">
                            <button class="btn btn-secondary" onclick="selectCertFile()">浏览</button>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>私钥文件</label>
                        <div class="file-input-wrapper">
                            <input type="text" id="keyPath" readonly placeholder="选择私钥文件 (.key, .pem)">
                            <button class="btn btn-secondary" onclick="selectKeyFile()">浏览</button>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label>端口</label>
                    <input type="number" class="port-input" id="port" value="3000" min="1024" max="65535">
                </div>
            </div>

            <div class="action-buttons">
                <button class="btn btn-primary" id="startBtn" onclick="startServer()">启动服务器</button>
                <button class="btn btn-danger" id="stopBtn" onclick="stopServer()" disabled>停止服务器</button>
            </div>

            <div class="log-section">
                <div class="section-title">运行日志</div>
                <div class="log-box" id="logBox"></div>
            </div>
        </div>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
