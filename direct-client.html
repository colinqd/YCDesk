<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 直连模式</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: white;
      border-radius: 16px;
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.35);
      width: 100%;
      max-width: 500px;
      padding: 35px;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-bottom: 25px;
    }
    .input-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 14px;
      color: #666;
      margin-bottom: 8px;
    }
    input {
      width: 100%;
      padding: 14px 18px;
      font-size: 16px;
      border: 2px solid #e2e8f0;
      border-radius: 10px;
      outline: none;
      transition: all 0.25s;
    }
    input:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
    }
    .btn {
      width: 100%;
      padding: 16px 32px;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 20px rgba(102, 126, 234, 0.5);
    }
    .status {
      text-align: center;
      margin-top: 20px;
      padding: 15px;
      border-radius: 10px;
      font-size: 14px;
    }
    .status.connecting {
      background: #fff3cd;
      color: #856404;
    }
    .status.connected {
      background: #e6f4ea;
      color: #135429;
    }
    .status.error {
      background: #f8d7da;
      color: #721c24;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>YCDesk 直连模式</h1>
    
    <div class="input-group">
      <label>对方 IPv4 或 IPv6 地址</label>
      <input type="text" id="remoteIp" placeholder="例如: 203.0.113.10 或 [2001:db8::1]" value="">
    </div>
    
    <div class="input-group">
      <label>端口（默认 3000）</label>
      <input type="number" id="remotePort" placeholder="3000" value="3000">
    </div>
    
    <button class="btn" onclick="startDirectConnection()">开始直连</button>
    
    <div id="status" class="status" style="display: none;"></div>
  </div>

  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <script>
    let peerConnection = null;
    
    const ICE_CONFIG = {
      iceServers: [
        { urls: 'stun:stun.l.google.com:19302' }
      ]
    };
    
    function updateStatus(text, type) {
      const statusEl = document.getElementById('status');
      statusEl.textContent = text;
      statusEl.style.display = 'block';
      statusEl.className = 'status ' + type;
    }
    
    async function startDirectConnection() {
      const remoteIp = document.getElementById('remoteIp').value.trim();
      const remotePort = document.getElementById('remotePort').value || 3000;
      
      if (!remoteIp) {
        alert('请输入对方IP地址');
        return;
      }
      
      updateStatus('正在建立直连...', 'connecting');
      
      try {
        peerConnection = new RTCPeerConnection(ICE_CONFIG);
        
        peerConnection.onicecandidate = (event) => {
          if (event.candidate) {
            console.log('ICE候选:', event.candidate);
          }
        };
        
        peerConnection.ontrack = (event) => {
          console.log('收到远程媒体流');
          window.remoteStream = event.streams[0];
          updateStatus('连接成功！正在打开远程窗口...', 'connected');
          window.electronAPI.openRemoteWindow();
        };
        
        peerConnection.onconnectionstatechange = () => {
          console.log('连接状态:', peerConnection.connectionState);
          if (peerConnection.connectionState === 'connected') {
            updateStatus('已建立直连！', 'connected');
          } else if (peerConnection.connectionState === 'failed') {
            updateStatus('连接失败，请检查网络和IP地址', 'error');
          }
        };
        
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        updateStatus('请在对方电脑上输入以下信息并接受连接', 'connecting');
        
        alert('请将以下 Offer 信息复制到对方电脑上的接收端：\n\n' + JSON.stringify(offer));
        
      } catch (error) {
        console.error('直连失败:', error);
        updateStatus('连接失败: ' + error.message, 'error');
      }
    }
  </script>
</body>
</html>
