<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 远程控制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
      z-index: 1000;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #e94560;
      font-weight: bold;
      font-size: 18px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #28a745;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.connecting {
      background: #ffc107;
    }

    .status-dot.error {
      background: #dc3545;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toolbar-right {
      display: flex;
      gap: 10px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .toolbar-btn:hover {
      background: #0f3460;
      border-color: #e94560;
    }

    .toolbar-btn.danger {
      border-color: #e94560;
      color: #e94560;
    }

    .toolbar-btn.danger:hover {
      background: #e94560;
      color: #fff;
    }

    #remoteScreen {
      position: absolute;
      top: 0;
      left: 0;
      background: #0f0f23;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100vw;
      height: 100vh;
      z-index: 1;
      transform-origin: center center;
    }

    #videoWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #videoContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #screenVideo {
      display: block;
      background: #000;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .video-frozen #screenVideo,
    .video-frozen canvas:not(#lockScreenCanvas),
    .video-frozen video {
      filter: grayscale(0.6) brightness(0.5);
      transition: filter 0.3s;
    }

    #unlockOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.92);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #unlockOverlay.hidden {
      display: none;
    }

    .unlock-dialog {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 2px solid #e74c3c;
      border-radius: 16px;
      padding: 40px;
      width: 420px;
      max-width: 90%;
      box-shadow: 0 20px 60px rgba(231, 76, 60, 0.3);
    }

    .unlock-dialog h2 {
      color: #e74c3c;
      margin-bottom: 8px;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
    }

    .unlock-dialog .unlock-subtitle {
      color: #ccc;
      text-align: center;
      margin-bottom: 24px;
      font-size: 13px;
      line-height: 1.6;
    }

    .unlock-input-group {
      margin-bottom: 20px;
    }

    .unlock-input-group label {
      display: block;
      color: #fff;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .unlock-input {
      width: 100%;
      padding: 14px 16px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }

    .unlock-input:focus {
      border-color: #e94560;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
    }

    .unlock-remember-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .unlock-remember-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .unlock-remember-group label {
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
    }

    .unlock-buttons {
      display: flex;
      gap: 12px;
    }

    .unlock-btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .unlock-btn-primary {
      background: #e94560;
      color: #fff;
    }

    .unlock-btn-primary:hover {
      background: #ff5a75;
    }

    .unlock-btn-secondary {
      background: #0f3460;
      color: #fff;
      border: 1px solid #1a4a7a;
    }

    .unlock-btn-secondary:hover {
      background: #1a4a7a;
    }

    .unlock-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .unlock-message.success {
      display: block;
      background: rgba(40, 167, 69, 0.2);
      color: #28a745;
    }

    .unlock-message.error {
      display: block;
      background: rgba(220, 53, 69, 0.2);
      color: #dc3545;
    }

    #placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      border-radius: 12px;
      z-index: 10;
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .placeholder-text {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .placeholder-subtext {
      font-size: 14px;
      color: #888;
    }

    #clickIndicator {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.6);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 100;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    #clickIndicator.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .toolbar-stats {
      display: flex;
      gap: 12px;
      padding: 0 12px;
      border-left: 1px solid #444;
      border-right: 1px solid #444;
      margin: 0 4px;
      white-space: nowrap;
    }

    .toolbar-stats .stats-item {
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 12px;
    }

    .toolbar-stats .stats-item .info-label {
      color: #666;
    }

    .toolbar-stats .stats-item .info-value {
      color: #4fc3f7;
      font-weight: 600;
    }

    #debugLog {
      position: fixed;
      top: 60px;
      right: 10px;
      width: 350px;
      max-height: 300px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      overflow-y: auto;
      border-radius: 5px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }
    
    #debugLogContent {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      user-select: text;
    }
    
    #debugLogToolbar {
      display: flex;
      gap: 5px;
      padding: 8px 10px;
      border-top: 1px solid #333;
      background: rgba(0,0,0,0.5);
    }
    
    .log-btn {
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    
    .log-btn:hover {
      background: #444;
      border-color: #666;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="logo">YCDesk</div>
      <div class="connection-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中...</span>
      </div>
    </div>
    <div class="toolbar-right">
      <select id="resolutionSelect" style="background: #333; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;">
        <option value="auto">自动分辨率</option>
        <option value="1920x1080">1920x1080</option>
        <option value="1600x900">1600x900</option>
        <option value="1280x720">1280x720</option>
        <option value="1024x768">1024x768</option>
        <option value="800x600">800x600</option>
      </select>
      <button class="toolbar-btn" onclick="window.ToolbarManager.unlockPanel()">🔓 解锁</button>
      <button class="toolbar-btn" onclick="window.ToolbarManager.lockRemoteScreen(window.connectionManager)">🔒 锁屏</button>
      <span class="toolbar-stats">
        <span class="stats-item">
          <span class="info-label">延迟:</span>
          <span class="info-value" id="latency">-- ms</span>
        </span>
        <span class="stats-item">
          <span class="info-label">帧率:</span>
          <span class="info-value" id="fps">-- fps</span>
        </span>
        <span class="stats-item">
          <span class="info-label">分辨率:</span>
          <span class="info-value" id="resolution">--</span>
        </span>
        <span class="stats-item">
          <span class="info-label">状态:</span>
          <span class="info-value" id="connectionState">--</span>
        </span>
      </span>
      <button class="toolbar-btn" onclick="UIState.toggleDebugLog()">日志</button>
      <button class="toolbar-btn" onclick="UIState.toggleFullscreen()">全屏</button>
      <button class="toolbar-btn danger" id="exitLockBtn" onclick="window.ToolbarManager.handleExit(window.connectionManager)" oncontextmenu="window.ToolbarManager.toggleExitBehavior(); return false;" title="右键切换退出模式">🚪 退出并锁屏</button>
      <button class="toolbar-btn danger" onclick="window.ToolbarManager.disconnect(window.connectionManager)">断开</button>
    </div>
  </div>

  <div id="remoteScreen">
    <div id="placeholder">
      <div class="placeholder-icon">🖥️</div>
      <div class="placeholder-text">正在建立连接...</div>
      <div class="placeholder-subtext" id="subtext">请稍候</div>
    </div>
    <div id="videoWrapper">
      <div id="videoContainer">
        <video id="screenVideo" autoplay playsinline style="display: none;"></video>
        <canvas id="optimizedCanvas" style="display: none; width: 100%; height: 100%; object-fit: contain; cursor: crosshair;"></canvas>
        <canvas id="lockScreenCanvas" style="display:none; width:100%; height:100%; object-fit:contain; cursor:crosshair;"></canvas>
      </div>
      <div id="clickIndicator"></div>
    </div>
  </div>

  <div id="debugLog" style="display:none;">
    <div id="debugLogContent"></div>
    <div id="debugLogToolbar">
      <button class="log-btn" onclick="UIState.copyAllLogs()">全部复制</button>
      <button class="log-btn" onclick="UIState.copySelectedLogs()">选择复制</button>
      <button class="log-btn" onclick="UIState.clearLogs()">清空</button>
    </div>
  </div>

  <!-- 外部库和共享模块 -->
  <script src="shared/data-channel-manager.js"></script>
  <script src="shared/input-protocol.js"></script>
  <script src="src/renderer/js/video-frame-receiver.js"></script>
  <script src="src/renderer/js/remote-video-handler.js"></script>
  <script src="shared/components/matrix-transformer.js"></script>
  <script src="shared/connection-state-machine.js"></script>
  <script src="shared/resolution-negotiator.js"></script>
  <script src="shared/auxiliary-channel-manager.js"></script>
  <script src="shared/fallback-handler.js"></script>
  <script src="shared/connection-manager-base.js"></script>
  <script src="shared/direct-connection-manager.js"></script>
  <script src="shared/signaling-connection-manager.js"></script>

  <!-- 模块化 JS -->
  <script src="src/renderer/js/modules/ui-state.js"></script>
  <script src="src/renderer/js/modules/keyboard-handler.js"></script>
  <script src="src/renderer/js/modules/mouse-handler.js"></script>
  <script src="src/renderer/js/modules/touch-handler.js"></script>
  <script src="src/renderer/js/modules/toolbar-manager.js"></script>
  <script src="src/renderer/js/modules/connection-events.js"></script>
  <script src="src/renderer/js/modules/unlock-ui.js"></script>

  <!-- 解锁面板 HTML -->
  <div id="unlockOverlay" class="hidden">
    <div class="unlock-dialog">
      <h2>🔒 被控端已锁定</h2>
      <div class="unlock-subtitle">远程电脑已进入锁屏状态，画面已暂停<br>请输入密码进行远程解锁以恢复连接</div>
      
      <div class="unlock-input-group">
        <label for="unlockPassword">密码</label>
        <input type="password" id="unlockPassword" class="unlock-input" placeholder="输入解锁密码">
      </div>
      
      <div class="unlock-remember-group">
        <input type="checkbox" id="rememberUnlockPassword">
        <label for="rememberUnlockPassword">记住密码（加密存储）</label>
      </div>
      
      <div class="unlock-buttons">
        <button class="unlock-btn unlock-btn-primary" id="btnManualUnlock">解锁</button>
        <button class="unlock-btn unlock-btn-secondary" id="btnAutoUnlock" style="display: none;">自动解锁</button>
      </div>
      
      <div id="unlockMessage" class="unlock-message"></div>
    </div>
  </div>

  <script>
    // 全局错误处理
    window.onerror = function(msg, url, line, col, error) {
      UIState.log('[全局错误] ' + msg + ' (' + url + ':' + line + ')');
      return false;
    };
    window.onunhandledrejection = function(event) {
      UIState.log('[Promise错误] ' + event.reason);
    };

    // === 应用状态变量 ===
    var videoElement = null;
    var videoContainer = null;
    var videoWrapper = null;
    var remoteScreenEl = null;
    var matrixTransformer = null;
    var connectionManager = null;
    var remoteVideoHandler = null;
    var inputEventsSetup = false;
    var isDragging = false;
    var connectionMode = 'direct';
    var lastMouseX = 0;
    var lastMouseY = 0;

    window.isDragging = false;

    // === MatrixTransformer/视频/性能 ===
    function setupMatrixTransformer() {
      try {
        UIState.log('setupMatrixTransformer 开始执行');
        UIState.log('setupMatrixTransformer: window.MatrixTransformer=' + !!window.MatrixTransformer);
        UIState.log('setupMatrixTransformer: typeof MatrixTransformer=' + typeof MatrixTransformer);
        
        if (typeof MatrixTransformer === 'undefined' && window.MatrixTransformer) {
          MatrixTransformer = window.MatrixTransformer;
        }
        
        if (typeof MatrixTransformer === 'undefined') {
          UIState.log('setupMatrixTransformer: MatrixTransformer 仍未定义，尝试延迟重试');
          setTimeout(setupMatrixTransformer, 100);
          return;
        }
        
        matrixTransformer = new MatrixTransformer({ logger: { log: function(m) { UIState.log(m) } } });
        UIState.log('setupMatrixTransformer: matrixTransformer 实例创建成功');
        
        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;
        matrixTransformer.setScreenSize(viewportWidth, viewportHeight);
        UIState.log('setupMatrixTransformer: 设置屏幕尺寸 ' + viewportWidth + 'x' + viewportHeight);
        
        var elementRect = remoteScreenEl.getBoundingClientRect();
        matrixTransformer.setElementSize(elementRect.width, elementRect.height);
        UIState.log('setupMatrixTransformer: 设置元素尺寸 ' + elementRect.width + 'x' + elementRect.height);
        
        var center = matrixTransformer.calculateCenterPosition();
        matrixTransformer.applyTransform(remoteScreenEl);
        UIState.log('setupMatrixTransformer: 完成');
      } catch (error) {
        UIState.log('setupMatrixTransformer 出错: ' + error.message + '\n' + error.stack);
      }
    }

    function setupPanZoomEvents() {
      remoteScreenEl.addEventListener('mousedown', function(e) {
        if (e.button === 1) {
          isDragging = true;
          window.isDragging = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          e.preventDefault();
        }
      });

      remoteScreenEl.addEventListener('mousemove', function(e) {
        if (isDragging && matrixTransformer) {
          var deltaX = e.clientX - lastMouseX;
          var deltaY = e.clientY - lastMouseY;
          matrixTransformer.updatePan(deltaX, deltaY);
          matrixTransformer.applyTransform(remoteScreenEl);
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        }
      });

      remoteScreenEl.addEventListener('mouseup', function(e) {
        if (e.button === 1) { isDragging = false; window.isDragging = false; }
      });

      remoteScreenEl.addEventListener('mouseleave', function() {
        isDragging = false; window.isDragging = false;
      });

      remoteScreenEl.addEventListener('wheel', function(e) {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          if (!matrixTransformer) return;
          var scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
          var newScale = matrixTransformer.scale * scaleFactor;
          matrixTransformer.updateScale(newScale, e.clientX, e.clientY);
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }, { passive: false });
    }

    function setupPerformanceMonitor() {
      var stats = { fps: 0, frameCount: 0, lastTime: performance.now() };

      function updateStats() {
        var now = performance.now();
        var elapsed = (now - stats.lastTime) / 1000;
        if (elapsed >= 1) {
          stats.fps = Math.round(stats.frameCount / elapsed);
          stats.frameCount = 0;
          stats.lastTime = now;
          var fpsEl = document.getElementById('fps');
          if (fpsEl) fpsEl.textContent = stats.fps + ' fps';
        }
        requestAnimationFrame(updateStats);
      }

      if (videoElement) {
        videoElement.addEventListener('timeupdate', function() { stats.frameCount++; });
      }

      setInterval(function() {
        if (connectionManager && connectionManager.peerConnection) {
          connectionManager.peerConnection.getStats().then(function(statsReport) {
            statsReport.forEach(function(report) {
              if (report.type === 'inbound-rtp' && report.kind === 'video') {
                stats.bytesReceived = report.bytesReceived || 0;
                stats.packetsLost = report.packetsLost || 0;
              }
            });
          });
        }
      }, 1000);

      updateStats();
    }

    function requestVideoRefresh() {
      if (!connectionManager || !connectionManager.dataChannelManager || !connectionManager.dataChannelManager.isOpen()) {
        UIState.log('无法请求视频刷新：数据通道未就绪');
        return;
      }
      UIState.log('发送视频刷新请求到被控端...');
      connectionManager.dataChannelManager.send({ type: 'video-refresh-request', timestamp: Date.now() });
    }

    // === 事件监听器 ===
    function setupUnlockStateListener() {
      window.electronAPI.on('unlock-state-changed', function(data) {
        UIState.log('收到锁定状态变化: isLocked=' + data.isLocked);
        var lockCanvas = document.getElementById('lockScreenCanvas');
        var vc = document.getElementById('videoContainer');
        if (data.isLocked === false) {
          UIState.log('屏幕已解锁，隐藏解锁面板和锁屏画面...');
          if (window.unlockUI) window.unlockUI.hideOverlay();
          if (lockCanvas) lockCanvas.style.display = 'none';
          UIState.updateStatus('已连接');
          if (vc) vc.classList.remove('video-frozen');
          
          // 延迟发送视频刷新请求，给被控端足够时间恢复
          setTimeout(function() { 
            UIState.log('发送第一次视频刷新请求...');
            requestVideoRefresh(); 
          }, 1000);
          
          // 如果第一次失败，再尝试一次
          setTimeout(function() { 
            UIState.log('发送第二次视频刷新请求（备用）...');
            requestVideoRefresh(); 
          }, 3000);
        } else if (data.isLocked === true) {
          UIState.log('屏幕已锁定，显示锁屏画面和解锁面板...');
          UIState.updateStatus('已锁定', 'error');
          if (vc) vc.classList.add('video-frozen');
          if (lockCanvas) lockCanvas.style.display = 'block';
          if (window.unlockUI) window.unlockUI.showOverlay();
        }
      });
    }

    function setupLockScreenFrameListener() {
      window.electronAPI.on('lock-screen-frame', function(data) {
        var canvas = document.getElementById('lockScreenCanvas');
        if (!canvas) return;
        var img = new Image();
        img.onload = function() {
          canvas.width = img.width;
          canvas.height = img.height;
          var ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0);
        };
        img.src = 'data:image/jpeg;base64,' + data.jpeg;
      });
    }

    // === 输入事件 ===
    window.setupInputEvents = function() {
      UIState.log('[remote.html] setupInputEvents() called');
      if (inputEventsSetup) return;
      inputEventsSetup = true;
      UIState.log('setupInputEvents 初始化');

      KeyboardHandler.setup(videoWrapper, function() { return connectionManager; });
      MouseHandler.setup(videoWrapper, videoContainer, function() { return matrixTransformer; }, function() { return connectionManager; });

      var isUnlockPanelOpen = false;
      videoWrapper.setAttribute('tabindex', '0');
      videoWrapper.focus();
      
      videoWrapper.addEventListener('blur', function() {
        setTimeout(function() {
          if (videoWrapper && !isUnlockPanelOpen) videoWrapper.focus();
        }, 10);
      });
      
      window.setUnlockPanelState = function(open) { isUnlockPanelOpen = open; };
      
      videoWrapper.addEventListener('click', function() { videoWrapper.focus(); });
      
      var resolutionSelect = document.getElementById('resolutionSelect');
      if (resolutionSelect) {
        resolutionSelect.addEventListener('change', function(e) {
          var value = e.target.value;
          if (value === 'auto' || !connectionManager || !connectionManager.dataChannelManager || 
              !connectionManager.dataChannelManager.isOpen()) return;
          var parts = value.split('x');
          var w = Number(parts[0]), h = Number(parts[1]);
          connectionManager.dataChannelManager.send({ type: 'resolution-change', width: w, height: h });
          UIState.log('请求分辨率变更: ' + w + 'x' + h);
        });
      }
    };

    // === 窗口尺寸变更 ===
    var resizeDebounceTimer = null;
    var RESIZE_DEBOUNCE_MS = 300;

    function handleWindowResize() {
      clearTimeout(resizeDebounceTimer);
      resizeDebounceTimer = setTimeout(function() {
        if (!matrixTransformer || !connectionManager) {
          UIState.log('[resize] matrixTransformer 或 connectionManager 未就绪，跳过');
          return;
        }

        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;
        UIState.log('[resize] 窗口尺寸变更: ' + viewportWidth + 'x' + viewportHeight);

        matrixTransformer.setScreenSize(viewportWidth, viewportHeight);

        var rse = document.getElementById('remoteScreen');
        if (rse) {
          var elementRect = rse.getBoundingClientRect();
          matrixTransformer.setElementSize(elementRect.width, elementRect.height);
        }

        matrixTransformer.calculateCenterPosition();
        matrixTransformer.applyTransform(document.getElementById('videoContainer'));

        if (videoElement && videoElement.videoWidth && videoElement.videoHeight) {
          var localSize = connectionManager.getLocalWindowSize();
          var remoteSize = { width: videoElement.videoWidth, height: videoElement.videoHeight };
          var displaySize = connectionManager.calculateOptimalSize(localSize, remoteSize);
          connectionManager.adjustVideoContainer(displaySize);
        }
      }, RESIZE_DEBOUNCE_MS);
    }

    window.addEventListener('resize', handleWindowResize);

    // === 连接模式入口 ===
    function initSignalingMode(data) {
      if (connectionManager) {
        UIState.log('连接管理器已经存在，忽略重复的启动信号');
        return;
      }
      connectionMode = 'signaling';
      
      connectionManager = new SignalingConnectionManager();
      connectionManager.isController = (data.mode === 'controller');
      connectionManager.targetDeviceId = data.targetDeviceId;
      window.connectionManager = connectionManager;
      setupAllConnectionEvents();
      
      connectionManager.setVideoElements(videoElement, videoContainer, videoWrapper, remoteScreenEl);
      connectionManager.setMatrixTransformer(matrixTransformer);
      
      window.electronAPI.on('signaling-offer', function(offerData) {
        if (connectionManager) connectionManager.handleSignalingOffer(offerData);
      });
      
      window.electronAPI.on('signaling-answer', function(answerData) {
        if (connectionManager) connectionManager.handleAnswer(answerData.answer);
      });
      
      window.electronAPI.on('signaling-ice-candidate', function(candidateData) {
        if (connectionManager) connectionManager.handleIceCandidate(candidateData.candidate);
      });
      
      connectionManager.connect({
        credentials: { deviceId: data.deviceId, sessionId: data.sessionId }
      }).then(function() {
        if (!inputEventsSetup && connectionManager.isController) {
          UIState.log('兜底调用 setupInputEvents');
          window.setupInputEvents();
        }
      }).catch(function(error) {
        UIState.log('信令模式连接失败: ' + error.message);
        UIState.updateStatus('连接失败', 'error');
      });
    }

    function initDirectMode(data) {
      if (connectionManager) return;
      connectionMode = 'direct';
      
      connectionManager = new DirectConnectionManager();
      connectionManager.setModeData(data);
      window.connectionManager = connectionManager;
      setupAllConnectionEvents();
      
      connectionManager.setVideoElements(videoElement, videoContainer, videoWrapper, remoteScreenEl);
      connectionManager.setMatrixTransformer(matrixTransformer);
      
      connectionManager.connect({}).then(function() {
        if (!inputEventsSetup) {
          UIState.log('兜底调用 setupInputEvents');
          window.setupInputEvents();
        }
      }).catch(function(error) {
        UIState.log('直连模式连接失败: ' + error.message);
        console.error('连接错误详情:', error);
        UIState.updateStatus('连接失败', 'error');
      });
    }

    function setupAllConnectionEvents() {
      ConnectionEvents.setupConnectionManagerEvents(connectionManager, matrixTransformer, videoElement);
    }

    // === 全局快捷键 ===
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && document.fullscreenElement) document.exitFullscreen();
      if (e.ctrlKey && (e.key === '0' || e.key === 'r')) {
        e.preventDefault();
        if (matrixTransformer) {
          matrixTransformer.resetView();
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }
      if (e.key === 'F11') { e.preventDefault(); UIState.toggleFullscreen(); }
    });

    // === 入口函数 ===
    function init() {
      if (window.isInitialized) {
        UIState.log('远程窗口已初始化，忽略重复调用');
        return;
      }
      window.isInitialized = true;

      window._cleanupFunctions = window._cleanupFunctions || []

      var _uaHandler = function(data) {
        UIState.log('收到锁定状态变化: isLocked=' + data.isLocked)
        var lockCanvas = document.getElementById('lockScreenCanvas')
        var vc = document.getElementById('videoContainer')
        if (data.isLocked === false) {
          UIState.log('屏幕已解锁，隐藏解锁面板和锁屏画面...')
          if (window.unlockUI) window.unlockUI.hideOverlay()
          if (lockCanvas) lockCanvas.style.display = 'none'
          UIState.updateStatus('已连接')
          if (vc) vc.classList.remove('video-frozen')
          setTimeout(function() { UIState.log('发送第一次视频刷新请求...'); requestVideoRefresh() }, 1000)
          setTimeout(function() { UIState.log('发送第二次视频刷新请求（备用）...'); requestVideoRefresh() }, 3000)
        } else if (data.isLocked === true) {
          UIState.log('屏幕已锁定，显示锁屏画面和解锁面板...')
          UIState.updateStatus('已锁定', 'error')
          if (vc) vc.classList.add('video-frozen')
          if (lockCanvas) lockCanvas.style.display = 'block'
          if (window.unlockUI) window.unlockUI.showOverlay()
        }
      }
      window.electronAPI.on('unlock-state-changed', _uaHandler)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('unlock-state-changed') })

      var _lsHandler = function(data) {
        var canvas = document.getElementById('lockScreenCanvas')
        if (!canvas) return
        var img = new Image()
        img.onload = function() { canvas.width = img.width; canvas.height = img.height; var ctx = canvas.getContext('2d'); ctx.drawImage(img, 0, 0) }
        img.src = 'data:image/jpeg;base64,' + data.jpeg
      }
      window.electronAPI.on('lock-screen-frame', _lsHandler)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('lock-screen-frame') })

      var _sigOffer = function(offerData) { if (connectionManager) connectionManager.handleSignalingOffer(offerData) }
      window.electronAPI.on('signaling-offer', _sigOffer)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('signaling-offer') })

      var _sigAnswer = function(answerData) { if (connectionManager) connectionManager.handleAnswer(answerData.answer) }
      window.electronAPI.on('signaling-answer', _sigAnswer)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('signaling-answer') })

      var _sigIce = function(candidateData) { if (connectionManager) connectionManager.handleIceCandidate(candidateData.candidate) }
      window.electronAPI.on('signaling-ice-candidate', _sigIce)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('signaling-ice-candidate') })

      var _sigStart = function(data) { initSignalingMode(data) }
      window.electronAPI.on('signaling-mode-start', _sigStart)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('signaling-mode-start') })

      var _dirStart = function(data) { initDirectMode(data) }
      window.electronAPI.on('direct-mode-start', _dirStart)
      window._cleanupFunctions.push(function() { window.electronAPI.removeAllListeners('direct-mode-start') })

      window.addEventListener('beforeunload', function() {
        if (window._cleanupFunctions) {
          window._cleanupFunctions.forEach(function(fn) { try { fn() } catch(e) {} })
        }
      })
      
      videoElement = document.getElementById('screenVideo');
      videoContainer = document.getElementById('videoContainer');
      videoWrapper = document.getElementById('videoWrapper');
      remoteScreenEl = document.getElementById('remoteScreen');
      
      var optimizedCanvas = document.getElementById('optimizedCanvas');
      if (optimizedCanvas && typeof RemoteVideoHandler !== 'undefined') {
        remoteVideoHandler = new RemoteVideoHandler({
          logger: { log: function(m) { UIState.log(m) }, error: console.error },
          useOptimizedTransfer: true
        });
        UIState.log('RemoteVideoHandler 已创建');
        window.remoteVideoHandler = remoteVideoHandler;
      }
      
      // 初始化解锁 UI
      window.unlockUI = new window.UnlockUI();
      
      // 添加解锁面板暴露函数
      window.openUnlockPanel = function() { if (window.unlockUI) window.unlockUI.showOverlay(); };
      window.ToolbarManager.unlockPanel = window.openUnlockPanel;
      
      UIState.log('远程窗口初始化开始');

      setupMatrixTransformer();
      setupPanZoomEvents();
      TouchHandler.setup(remoteScreenEl, function() { return matrixTransformer; });
      setupPerformanceMonitor();
      
      window.electronAPI.send('remote-window-ready', {});
      
      try {
        window.electronAPI.getScreenSize().then(function(screenSize) {
          var resEl = document.getElementById('resolution');
          if (resEl) resEl.textContent = screenSize.width + 'x' + screenSize.height;
        });
      } catch (error) {
        UIState.log('获取屏幕尺寸失败: ' + error.message);
      }
      
      UIState.updateStatus('正在连接...');
      UIState.showPlaceholder('正在建立连接...', '请稍候');
    }

    // 启动
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', init);
    } else {
      init();
    }
  </script>
</body>
</html>
