<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 远程桌面控制</title>
  <link rel="stylesheet" href="src/renderer/css/styles.css">
  <script src="https://cdn.socket.io/4.6.0/socket.io.min.js"></script>
  <style>
    body {
      background-color: #1e3a5f !important;
    }
    .debug-page-label {
      position: fixed;
      top: 5px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 0, 0, 0.8);
      color: white;
      padding: 2px 10px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      z-index: 99999;
    }
  </style>
</head>
<body>
  <div class="debug-page-label">主窗口 (index.html)</div>
  <div class="container">
    <div class="header">
      <div class="header-content">
        <div class="header-title">
          <h1>YCDesk</h1>
          <p>远程桌面控制 - 安全、快速、便捷</p>
        </div>
        <div class="window-controls">
          <button class="win-ctrl-btn minimize-btn" onclick="minimizeWindow()" title="最小化">─</button>
          <button class="win-ctrl-btn close-btn" onclick="closeWindow()" title="关闭">✕</button>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="rolePage" class="page active">
        <div class="role-selector">
          <div class="role-card" onclick="selectRole('controller')">
            <div class="role-icon">🖱️</div>
            <div class="role-title">主控端</div>
            <div class="role-desc">控制其他电脑<br>输入对方IP和端口即可连接</div>
          </div>
          <div class="role-card" onclick="selectRole('controlled')">
            <div class="role-icon">💻</div>
            <div class="role-title">被控端</div>
            <div class="role-desc">让其他电脑控制本机<br>启动监听等待连接</div>
          </div>
        </div>
      </div>

      <div id="controlledPage" class="page">
        <button class="back-btn" onclick="goBack()">← 返回选择</button>
        
        <div class="section">
          <div class="section-title">设备信息</div>
          <div class="device-id-box">
            <label>设备 ID</label>
            <div class="device-id-value" id="deviceId" onclick="copyDeviceId()">
              加载中...
            </div>
          </div>
          <div class="status-badge" id="serverStatus">
            <span class="status-dot"></span>
            <span id="serverStatusText">就绪</span>
          </div>
        </div>

        <div class="section">
          <div class="section-title">连接模式</div>
          <div class="mode-selector">
            <div class="mode-tab active" onclick="switchControlledMode('direct')">直连模式</div>
            <div class="mode-tab" onclick="switchControlledMode('signaling')">信令服务器模式</div>
          </div>
          
          <div id="controlledDirectMode" class="mode-content active">
            <div class="input-group">
              <label>监听端口</label>
              <input type="number" id="listenPort" placeholder="8080" value="8080" min="1024" max="65535">
              <button class="btn btn-primary" onclick="startListening()">开始监听</button>
              <button class="btn btn-danger" onclick="stopListening()">停止监听</button>
            </div>
          </div>
          
          <div id="controlledSignalingMode" class="mode-content">
            <div class="input-group">
              <label>信令服务器地址</label>
              <input type="text" id="controlledServerUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
              <button class="btn btn-primary" onclick="controlledConnectToServer()">连接服务器</button>
              <button class="btn btn-danger" onclick="controlledDisconnectFromServer()">断开连接</button>
            </div>
          </div>
        </div>

        <div class="section" id="controlledDirectSection">
          <div class="section-title">本机网络地址</div>
          <div class="ip-list" id="localIpList">
            加载中...
          </div>
        </div>

        <div class="log-box">
          <div class="log-title">连接日志</div>
          <div class="log-content" id="connectionLog"></div>
        </div>
      </div>

      <div id="controllerPage" class="page">
        <button class="back-btn" onclick="goBack()">← 返回选择</button>
        
        <div class="section">
          <div class="section-title">连接模式</div>
          <div class="mode-selector">
            <div class="mode-tab active" onclick="switchControllerMode('direct')">直连模式</div>
            <div class="mode-tab" onclick="switchControllerMode('signaling')">信令服务器模式</div>
          </div>
          
          <div id="controllerDirectMode" class="mode-content active">
            <div class="section">
              <div class="section-title">历史连接记录</div>
              <div class="history-list" id="directHistoryList">
                <div class="history-empty">暂无历史连接记录</div>
              </div>
            </div>
            <div class="two-col">
              <div class="input-group">
                <label>对方 IP 地址</label>
                <input type="text" id="remoteIp" placeholder="例如: 192.168.1.100, 203.0.113.10">
              </div>
              <div class="input-group">
                <label>对方端口</label>
                <input type="number" id="remotePort" placeholder="8080" value="8080" min="1024" max="65535">
              </div>
            </div>
            <button class="btn btn-primary" onclick="connectDirect()" style="margin-top: 20px;">连接</button>
          </div>
          
          <div id="controllerSignalingMode" class="mode-content">
            <div class="section">
              <div class="section-title">历史连接记录</div>
              <div class="history-list" id="signalingHistoryList">
                <div class="history-empty">暂无历史连接记录</div>
              </div>
            </div>
            <div class="input-group">
              <label>信令服务器地址</label>
              <input type="text" id="controllerServerUrl" placeholder="http://localhost:3000" value="http://localhost:3000">
              <button class="btn btn-secondary" style="margin-top: 10px;" onclick="controllerConnectToServer()">连接服务器</button>
              <button class="btn btn-danger" style="margin-top: 10px;" onclick="controllerDisconnectFromServer()">断开连接</button>
            </div>
            <div class="input-group" style="margin-top: 20px;">
              <label>对方设备 ID</label>
              <input type="text" id="targetDeviceId" placeholder="输入对方设备 ID" maxlength="9">
              <button class="btn btn-primary" style="margin-top: 10px;" onclick="connectDevice()">连接</button>
            </div>
          </div>
        </div>

        <div class="log-box">
          <div class="log-title">连接日志</div>
          <div class="log-content" id="connectionLogController"></div>
        </div>
      </div>
    </div>

    <div class="footer">
      YCDesk v1.0.0 | 远程桌面控制软件 | Linux 版本
    </div>
  </div>

  <script src="./shared/config.js"></script>
  <script src="./shared/data-channel-manager.js"></script>
  <script src="src/renderer/js/ui-manager.js"></script>
  <script src="src/renderer/js/history-manager.js"></script>
  <script src="src/renderer/js/connection-manager.js"></script>
  <script src="src/renderer/js/signaling-mode.js"></script>
  <script src="src/renderer/js/direct-mode.js"></script>
  <script src="src/renderer/js/app.js"></script>
</body>
</html>
