<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 远程控制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #e94560;
      font-weight: bold;
      font-size: 18px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #28a745;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toolbar-right {
      display: flex;
      gap: 10px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .toolbar-btn:hover {
      background: #0f3460;
      border-color: #e94560;
    }

    .toolbar-btn.danger {
      border-color: #e94560;
      color: #e94560;
    }

    .toolbar-btn.danger:hover {
      background: #e94560;
      color: #fff;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .screen-container {
      background: #0f0f23;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      max-width: 100%;
      max-height: 100%;
    }

    .screen-video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
      cursor: crosshair;
    }

    .placeholder {
      width: 1280px;
      max-width: 100%;
      height: 720px;
      max-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .placeholder-text {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .placeholder-subtext {
      font-size: 14px;
      color: #888;
    }

    .info-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 10px 20px;
      border-radius: 20px;
      color: #aaa;
      font-size: 13px;
      display: flex;
      gap: 20px;
      backdrop-filter: blur(10px);
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="logo">YCDesk</div>
      <div class="connection-status">
        <span class="status-dot"></span>
        <span id="statusText">连接中...</span>
      </div>
    </div>
    <div class="toolbar-right">
      <button class="toolbar-btn" onclick="toggleFullscreen()">全屏</button>
      <button class="toolbar-btn danger" onclick="disconnect()">断开</button>
    </div>
  </div>

  <div class="content">
    <div class="screen-container">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🖥️</div>
        <div class="placeholder-text">正在建立连接...</div>
        <div class="placeholder-subtext" id="subtext">请稍候</div>
      </div>
      <video class="screen-video" id="screenVideo" autoplay playsinline style="display: none;"></video>
    </div>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <span class="info-label">延迟:</span>
      <span class="info-value" id="latency">-- ms</span>
    </div>
    <div class="info-item">
      <span class="info-label">帧率:</span>
      <span class="info-value" id="fps">-- fps</span>
    </div>
    <div class="info-item">
      <span class="info-label">分辨率:</span>
      <span class="info-value" id="resolution">--</span>
    </div>
  </div>

  <div id="debugLog" style="position: fixed; top: 60px; right: 10px; width: 350px; max-height: 300px; background: rgba(0,0,0,0.8); color: #0f0; font-family: monospace; font-size: 11px; padding: 10px; overflow-y: auto; border-radius: 5px; z-index: 9999;"></div>

  <script>
    const DATA_CHANNEL_STATE = {
      CONNECTING: 'connecting',
      OPEN: 'open',
      CLOSING: 'closing',
      CLOSED: 'closed'
    }

    class DataChannelManager {
      constructor(options = {}) {
        this.dataChannel = null
        this.messageQueue = []
        this.messageIdCounter = 0
        this.pendingMessages = new Map()
        this.options = {
          maxRetries: 3,
          retryInterval: 1000,
          maxQueueSize: 100,
          ...options
        }
        this.callbacks = {
          onOpen: null,
          onClose: null,
          onError: null,
          onMessage: null,
          onBufferedAmountLow: null
        }
        this.isReconnecting = false
        this.logger = options.logger || console
      }

      setDataChannel(channel) {
        if (this.dataChannel) {
          this.removeEventListeners()
        }

        this.dataChannel = channel
        this.addEventListeners()
        this.flushQueue()
      }

      addEventListeners() {
        if (!this.dataChannel) return

        this.dataChannel.onopen = this.handleOpen.bind(this)
        this.dataChannel.onclose = this.handleClose.bind(this)
        this.dataChannel.onerror = this.handleError.bind(this)
        this.dataChannel.onmessage = this.handleMessage.bind(this)
        this.dataChannel.onbufferedamountlow = this.handleBufferedAmountLow.bind(this)
      }

      removeEventListeners() {
        if (!this.dataChannel) return

        this.dataChannel.onopen = null
        this.dataChannel.onclose = null
        this.dataChannel.onerror = null
        this.dataChannel.onmessage = null
        this.dataChannel.onbufferedamountlow = null
      }

      handleOpen() {
        this.logger.log('[DataChannel] 数据通道已打开')
        this.isReconnecting = false
        this.flushQueue()
        
        if (this.callbacks.onOpen) {
          this.callbacks.onOpen()
        }
      }

      handleClose() {
        this.logger.log('[DataChannel] 数据通道已关闭')
        
        if (this.callbacks.onClose) {
          this.callbacks.onClose()
        }
      }

      handleError(error) {
        this.logger.error('[DataChannel] 数据通道错误:', error)
        
        if (this.callbacks.onError) {
          this.callbacks.onError(error)
        }
      }

      handleMessage(event) {
        try {
          const data = JSON.parse(event.data)
          
          if (data.ack && this.pendingMessages.has(data.ackId)) {
            this.pendingMessages.delete(data.ackId)
            return
          }
          
          if (data.id) {
            this.sendAck(data.id)
          }
          
          if (this.callbacks.onMessage) {
            this.callbacks.onMessage(data)
          }
        } catch (e) {
          this.logger.error('[DataChannel] 解析消息失败:', e)
        }
      }

      handleBufferedAmountLow() {
        if (this.callbacks.onBufferedAmountLow) {
          this.callbacks.onBufferedAmountLow()
        }
        this.flushQueue()
      }

      send(data, requireAck = false) {
        const message = {
          ...data,
          id: requireAck ? ++this.messageIdCounter : undefined,
          timestamp: Date.now()
        }

        if (!this.isOpen()) {
          this.logger.log('[DataChannel] 通道未打开，加入队列')
          this.enqueue(message, requireAck)
          return false
        }

        return this.sendRaw(message, requireAck)
      }

      sendRaw(message, requireAck) {
        try {
          const json = JSON.stringify(message)
          
          if (this.dataChannel.bufferedAmount > 1024 * 1024) {
            this.logger.warn('[DataChannel] 缓冲区过大，加入队列')
            this.enqueue(message, requireAck)
            return false
          }

          this.dataChannel.send(json)
          
          if (requireAck && message.id) {
            this.trackPendingMessage(message)
          }
          
          return true
        } catch (e) {
          this.logger.error('[DataChannel] 发送失败:', e)
          this.enqueue(message, requireAck)
          return false
        }
      }

      sendAck(messageId) {
        this.send({ ack: true, ackId: messageId }, false)
      }

      trackPendingMessage(message) {
        const retryCount = 0
        const timer = setTimeout(() => {
          this.retryMessage(message, retryCount)
        }, this.options.retryInterval)

        this.pendingMessages.set(message.id, {
          message,
          timer,
          retryCount
        })
      }

      retryMessage(message, retryCount) {
        if (retryCount >= this.options.maxRetries) {
          this.logger.error('[DataChannel] 消息重发失败，放弃:', message.id)
          this.pendingMessages.delete(message.id)
          return
        }

        if (!this.isOpen()) {
          this.logger.log('[DataChannel] 通道关闭，停止重发')
          return
        }

        this.logger.log('[DataChannel] 重发消息:', message.id, '重试次数:', retryCount + 1)
        
        this.pendingMessages.delete(message.id)
        this.sendRaw(message, true)
      }

      enqueue(message, requireAck) {
        if (this.messageQueue.length >= this.options.maxQueueSize) {
          this.logger.warn('[DataChannel] 队列已满，丢弃最早的消息')
          this.messageQueue.shift()
        }
        this.messageQueue.push({ message, requireAck })
      }

      flushQueue() {
        if (!this.isOpen() || this.messageQueue.length === 0) {
          return
        }

        this.logger.log('[DataChannel] 刷新队列，剩余:', this.messageQueue.length)
        
        while (this.messageQueue.length > 0 && this.isOpen()) {
          const { message, requireAck } = this.messageQueue[0]
          if (this.sendRaw(message, requireAck)) {
            this.messageQueue.shift()
          } else {
            break
          }
        }
      }

      isOpen() {
        return this.dataChannel && this.dataChannel.readyState === 'open'
      }

      getReadyState() {
        return this.dataChannel ? this.dataChannel.readyState : 'closed'
      }

      getBufferedAmount() {
        return this.dataChannel ? this.dataChannel.bufferedAmount : 0
      }

      setOnOpen(callback) {
        this.callbacks.onOpen = callback
      }

      setOnClose(callback) {
        this.callbacks.onClose = callback
      }

      setOnError(callback) {
        this.callbacks.onError = callback
      }

      setOnMessage(callback) {
        this.callbacks.onMessage = callback
      }

      setOnBufferedAmountLow(callback) {
        this.callbacks.onBufferedAmountLow = callback
      }

      close() {
        this.messageQueue = []
        this.pendingMessages.forEach(({ timer }) => {
          clearTimeout(timer)
        })
        this.pendingMessages.clear()
        
        if (this.dataChannel) {
          this.removeEventListeners()
          this.dataChannel.close()
          this.dataChannel = null
        }
      }

      reset() {
        this.close()
        this.messageIdCounter = 0
      }
    }

    let videoElement = null;
    let frameCount = 0;
    let lastTime = performance.now();
    let sendInputEvent = null;
    let latencyCheckInterval = null;
    let lastLatency = 0;
    let peerConnection = null;
    let dataChannelManager = null;
    let pendingIceCandidates = [];

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      const logMessage = `[${timestamp}] ${message}`;
      console.log(logMessage);
      
      const debugLog = document.getElementById('debugLog');
      if (debugLog) {
        const div = document.createElement('div');
        div.textContent = logMessage;
        debugLog.appendChild(div);
        debugLog.scrollTop = debugLog.scrollHeight;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function disconnect() {
      stopLatencyCheck();
      if (confirm('确定要断开连接吗？')) {
        if (peerConnection) {
          peerConnection.close();
        }
        window.close();
      }
    }

    function startLatencyCheck() {
      if (latencyCheckInterval) return;
      
      latencyCheckInterval = setInterval(() => {
        checkLatency();
      }, 2000);
      
      checkLatency();
    }

    function stopLatencyCheck() {
      if (latencyCheckInterval) {
        clearInterval(latencyCheckInterval);
        latencyCheckInterval = null;
      }
    }

    function checkLatency() {
      const sendTime = performance.now();
      
      if (dataChannelManager && dataChannelManager.isOpen()) {
        dataChannelManager.send({
          type: 'ping',
          timestamp: sendTime
        });
      }
      
      setTimeout(() => {
        const latency = Math.round(performance.now() - sendTime);
        if (latency > 0 && latency < 5000) {
          lastLatency = latency;
          document.getElementById('latency').textContent = `${latency} ms`;
        }
      }, 500);
    }

    function setupInputEvents() {
      const videoContainer = document.querySelector('.screen-container');
      
      if (dataChannelManager && dataChannelManager.isOpen()) {
        sendInputEvent = (eventData) => {
          dataChannelManager.send({
            type: 'input',
            ...eventData
          }, false);
        };

        videoContainer.addEventListener('mousemove', (e) => {
          const rect = videoElement.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          
          sendInputEvent({
            inputType: 'mousemove',
            x: Math.max(0, Math.min(1, x)),
            y: Math.max(0, Math.min(1, y))
          });
        });

        videoContainer.addEventListener('mousedown', (e) => {
          const rect = videoElement.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          
          sendInputEvent({
            inputType: 'mousedown',
            button: e.button,
            x: Math.max(0, Math.min(1, x)),
            y: Math.max(0, Math.min(1, y))
          });
        });

        videoContainer.addEventListener('mouseup', (e) => {
          const rect = videoElement.getBoundingClientRect();
          const x = (e.clientX - rect.left) / rect.width;
          const y = (e.clientY - rect.top) / rect.height;
          
          sendInputEvent({
            inputType: 'mouseup',
            button: e.button,
            x: Math.max(0, Math.min(1, x)),
            y: Math.max(0, Math.min(1, y))
          });
        });

        videoContainer.addEventListener('wheel', (e) => {
          e.preventDefault();
          sendInputEvent({
            inputType: 'wheel',
            deltaY: e.deltaY,
            deltaX: e.deltaX || 0
          });
        }, { passive: false });

        videoContainer.addEventListener('contextmenu', (e) => {
          e.preventDefault();
        });

        document.addEventListener('keydown', (e) => {
          e.preventDefault();
          sendInputEvent({
            inputType: 'keydown',
            key: e.key,
            code: e.code,
            keyCode: e.keyCode,
            ctrlKey: e.ctrlKey,
            shiftKey: e.shiftKey,
            altKey: e.altKey,
            metaKey: e.metaKey
          });
        });

        document.addEventListener('keyup', (e) => {
          e.preventDefault();
          sendInputEvent({
            inputType: 'keyup',
            key: e.key,
            code: e.code,
            keyCode: e.keyCode,
            ctrlKey: e.ctrlKey,
            shiftKey: e.shiftKey,
            altKey: e.altKey,
            metaKey: e.metaKey
          });
        });

        console.log('输入事件监听已设置');
      }
    }

    function updateStatus(text, isConnected = true) {
      document.getElementById('statusText').textContent = text;
    }

    function showPlaceholder(text, subtext = '') {
      document.getElementById('placeholder').style.display = 'flex';
      document.getElementById('screenVideo').style.display = 'none';
      document.querySelector('.placeholder-text').textContent = text;
      document.getElementById('subtext').textContent = subtext;
    }

    function showVideo() {
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('screenVideo').style.display = 'block';
    }

    function updateFps() {
      const now = performance.now();
      const elapsed = (now - lastTime) / 1000;
      if (elapsed >= 1) {
        const fps = Math.round(frameCount / elapsed);
        document.getElementById('fps').textContent = `${fps} fps`;
        frameCount = 0;
        lastTime = now;
      }
    }

    function onVideoFrame() {
      frameCount++;
      updateFps();
      requestAnimationFrame(onVideoFrame);
    }

    async function createPeerConnection() {
      peerConnection = new RTCPeerConnection({ iceServers: [] });
      
      peerConnection.onicecandidate = (event) => {
        if (event.candidate) {
          log('发送ICE候选');
          window.electronAPI.sendToMainWindow('webrtc-ice-candidate', {
            candidate: {
              candidate: event.candidate.candidate,
              sdpMid: event.candidate.sdpMid,
              sdpMLineIndex: event.candidate.sdpMLineIndex
            }
          });
        }
      };
      
      peerConnection.oniceconnectionstatechange = () => {
        log('ICE连接状态: ' + peerConnection.iceConnectionState);
      };
      
      peerConnection.ontrack = (event) => {
        log('收到远程媒体流，track数量: ' + event.tracks.length);
        const stream = event.streams[0];
        if (stream) {
          log('流ID: ' + stream.id);
          videoElement.srcObject = stream;
          
          videoElement.onloadedmetadata = () => {
            log('视频流加载成功');
            showVideo();
            updateStatus('已连接');
            document.getElementById('resolution').textContent = 
              `${videoElement.videoWidth}x${videoElement.videoHeight}`;
            requestAnimationFrame(onVideoFrame);
            setupInputEvents();
            startLatencyCheck();
          };
          
          videoElement.onerror = (error) => {
            console.error('视频错误:', error);
            showPlaceholder('连接失败', '视频流加载失败');
            updateStatus('连接失败');
          };
        }
      };
      
      peerConnection.onconnectionstatechange = () => {
        log('连接状态: ' + peerConnection.connectionState);
      };
      
      dataChannelManager = new DataChannelManager({ logger: { log: log, error: console.error } });
      
      dataChannelManager.setOnOpen(async () => {
        log('数据通道已打开');
        
        try {
          const screenInfo = await window.electronAPI.getScreenSize();
          log('发送屏幕尺寸: ' + screenInfo.width + 'x' + screenInfo.height);
          dataChannelManager.send({
            type: 'screen-size',
            width: screenInfo.width,
            height: screenInfo.height,
            scaleFactor: screenInfo.scaleFactor,
            workArea: screenInfo.workArea
          });
        } catch (e) {
          console.error('获取屏幕尺寸失败:', e);
        }
      });
      
      dataChannelManager.setOnMessage((data) => {
        if (data.type === 'pong') {
          const latency = Math.round(performance.now() - data.timestamp);
          if (latency > 0 && latency < 5000) {
            lastLatency = latency;
            document.getElementById('latency').textContent = `${latency} ms`;
          }
        }
      });
      
      dataChannelManager.setOnClose(() => {
        log('数据通道已关闭');
      });
      
      dataChannelManager.setOnError((error) => {
        console.error('数据通道错误:', error);
      });
      
      peerConnection.ondatachannel = (event) => {
        log('收到数据通道');
        dataChannelManager.setDataChannel(event.channel);
      };
      
      log('添加视频接收transceiver');
      peerConnection.addTransceiver('video', { direction: 'recvonly' });
      
      log('创建数据通道');
      const newDataChannel = peerConnection.createDataChannel('control');
      dataChannelManager.setDataChannel(newDataChannel);
      
      try {
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        
        log('发送offer到主窗口');
        window.electronAPI.sendToMainWindow('webrtc-offer', {
          offer: {
            type: offer.type,
            sdp: offer.sdp
          }
        });
      } catch (error) {
        log('创建offer失败: ' + error.message);
      }
    }



    async function handleAnswer(answer) {
      if (!answer) {
        log('错误: answer为空');
        return;
      }
      
      try {
        log('设置answer...');
        await peerConnection.setRemoteDescription(new RTCSessionDescription(answer));
        log('answer设置成功');
        
        log('检查transceivers...');
        const transceivers = peerConnection.getTransceivers();
        log('transceivers数量: ' + transceivers.length);
        transceivers.forEach((t, i) => {
          log('Transceiver ' + i + ': mid=' + t.mid + ', direction=' + t.direction + ', currentDirection=' + t.currentDirection + ', receiver.track=' + (t.receiver.track ? t.receiver.track.kind : 'null'));
        });
        
        await addPendingIceCandidates();
        
        log('手动检查并显示视频...');
        checkAndDisplayVideo();
      } catch (error) {
        log('设置answer失败: ' + error.message);
      }
    }

    function checkAndDisplayVideo() {
      const transceivers = peerConnection.getTransceivers();
      for (const t of transceivers) {
        if (t.receiver && t.receiver.track && t.receiver.track.kind === 'video') {
          log('找到视频track: ' + t.receiver.track.id);
          const stream = new MediaStream([t.receiver.track]);
          videoElement.srcObject = stream;
          
          videoElement.onloadedmetadata = () => {
            log('视频流加载成功');
            showVideo();
            updateStatus('已连接');
            document.getElementById('resolution').textContent = 
              `${videoElement.videoWidth}x${videoElement.videoHeight}`;
            requestAnimationFrame(onVideoFrame);
            setupInputEvents();
            startLatencyCheck();
          };
          
          videoElement.onerror = (error) => {
            log('视频错误: ' + error);
            showPlaceholder('连接失败', '视频流加载失败');
            updateStatus('连接失败');
          };
          
          log('视频track已设置到video元素');
          return;
        }
      }
      log('未找到视频track');
    }

    async function handleIceCandidate(candidate) {
      if (!candidate) {
        return;
      }
      
      try {
        if (candidate.sdpMid === null && candidate.sdpMLineIndex === null) {
          return;
        }
        
        if (!peerConnection || !peerConnection.remoteDescription) {
          log('缓存ICE候选（远程描述未设置）');
          pendingIceCandidates.push(candidate);
          return;
        }
        
        await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        log('ICE候选添加成功');
      } catch (error) {
        log('添加ICE候选失败: ' + error.message);
      }
    }

    async function addPendingIceCandidates() {
      log('添加缓存的ICE候选: ' + pendingIceCandidates.length + ' 个');
      for (const candidate of pendingIceCandidates) {
        try {
          await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (error) {
          log('添加缓存ICE候选失败: ' + error.message);
        }
      }
      pendingIceCandidates = [];
    }

    async function init() {
      videoElement = document.getElementById('screenVideo');
      log('远程窗口初始化开始');
      
      try {
        const screenSize = await window.electronAPI.getScreenSize();
        document.getElementById('resolution').textContent = `${screenSize.width}x${screenSize.height}`;
        log('获取屏幕尺寸成功');
      } catch (error) {
        log('获取屏幕尺寸失败: ' + error.message);
      }

      updateStatus('正在连接...');
      showPlaceholder('正在建立WebRTC连接...', '请稍候');

      log('设置IPC监听器...');
      window.electronAPI.on('webrtc-answer', async (data) => {
        log('收到answer事件: ' + JSON.stringify(data).substring(0, 100));
        await handleAnswer(data.answer);
      });

      window.electronAPI.on('webrtc-ice-candidate', async (data) => {
        log('收到ICE候选事件');
        await handleIceCandidate(data.candidate);
      });
      log('IPC监听器设置完成');

      log('开始创建WebRTC连接...');
      await createPeerConnection();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen();
      }
    });

    init();
  </script>
</body>
</html>
