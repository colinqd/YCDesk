<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 远程控制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .toolbar {
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #e94560;
      font-weight: bold;
      font-size: 18px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #28a745;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toolbar-right {
      display: flex;
      gap: 10px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .toolbar-btn:hover {
      background: #0f3460;
      border-color: #e94560;
    }

    .toolbar-btn.danger {
      border-color: #e94560;
      color: #e94560;
    }

    .toolbar-btn.danger:hover {
      background: #e94560;
      color: #fff;
    }

    .content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow: hidden;
    }

    .screen-container {
      background: #0f0f23;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      max-width: 100%;
      max-height: 100%;
    }

    .screen-video {
      display: block;
      width: 100%;
      height: auto;
      background: #000;
      cursor: crosshair;
    }

    .placeholder {
      width: 1280px;
      max-width: 100%;
      height: 720px;
      max-height: calc(100vh - 150px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .placeholder-text {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .placeholder-subtext {
      font-size: 14px;
      color: #888;
    }

    .info-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 10px 20px;
      border-radius: 20px;
      color: #aaa;
      font-size: 13px;
      display: flex;
      gap: 20px;
      backdrop-filter: blur(10px);
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="logo">YCDesk</div>
      <div class="connection-status">
        <span class="status-dot"></span>
        <span id="statusText">连接中...</span>
      </div>
    </div>
    <div class="toolbar-right">
      <button class="toolbar-btn" onclick="toggleFullscreen()">全屏</button>
      <button class="toolbar-btn danger" onclick="disconnect()">断开</button>
    </div>
  </div>

  <div class="content">
    <div class="screen-container">
      <div class="placeholder" id="placeholder">
        <div class="placeholder-icon">🖥️</div>
        <div class="placeholder-text">正在建立连接...</div>
        <div class="placeholder-subtext" id="subtext">请稍候</div>
      </div>
      <video class="screen-video" id="screenVideo" autoplay playsinline style="display: none;"></video>
    </div>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <span class="info-label">延迟:</span>
      <span class="info-value" id="latency">-- ms</span>
    </div>
    <div class="info-item">
      <span class="info-label">帧率:</span>
      <span class="info-value" id="fps">-- fps</span>
    </div>
    <div class="info-item">
      <span class="info-label">分辨率:</span>
      <span class="info-value" id="resolution">--</span>
    </div>
  </div>

  <script>
    let videoElement = null;
    let frameCount = 0;
    let lastTime = performance.now();

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function disconnect() {
      if (confirm('确定要断开连接吗？')) {
        window.close();
      }
    }

    function updateStatus(text, isConnected = true) {
      document.getElementById('statusText').textContent = text;
    }

    function showPlaceholder(text, subtext = '') {
      document.getElementById('placeholder').style.display = 'flex';
      document.getElementById('screenVideo').style.display = 'none';
      document.querySelector('.placeholder-text').textContent = text;
      document.getElementById('subtext').textContent = subtext;
    }

    function showVideo() {
      document.getElementById('placeholder').style.display = 'none';
      document.getElementById('screenVideo').style.display = 'block';
    }

    function updateFps() {
      const now = performance.now();
      const elapsed = (now - lastTime) / 1000;
      if (elapsed >= 1) {
        const fps = Math.round(frameCount / elapsed);
        document.getElementById('fps').textContent = `${fps} fps`;
        frameCount = 0;
        lastTime = now;
      }
    }

    function onVideoFrame() {
      frameCount++;
      updateFps();
      requestAnimationFrame(onVideoFrame);
    }

    async function init() {
      videoElement = document.getElementById('screenVideo');
      
      try {
        const screenSize = await window.electronAPI.getScreenSize();
        document.getElementById('resolution').textContent = `${screenSize.width}x${screenSize.height}`;
      } catch (error) {
        console.error('获取屏幕尺寸失败:', error);
      }

      if (window.opener && window.opener.remoteStream) {
        try {
          updateStatus('正在连接...');
          showPlaceholder('正在接收远程屏幕...');
          
          videoElement.srcObject = window.opener.remoteStream;
          
          videoElement.onloadedmetadata = () => {
            console.log('视频流已加载');
            showVideo();
            updateStatus('已连接');
            document.getElementById('resolution').textContent = 
              `${videoElement.videoWidth}x${videoElement.videoHeight}`;
            requestAnimationFrame(onVideoFrame);
          };

          videoElement.onerror = (error) => {
            console.error('视频错误:', error);
            showPlaceholder('连接失败', '请重新尝试连接');
            updateStatus('连接失败');
          };

        } catch (error) {
          console.error('显示远程屏幕失败:', error);
          showPlaceholder('连接失败', error.message);
          updateStatus('连接失败');
        }
      } else {
        showPlaceholder('等待远程屏幕...', '请先在主窗口发起连接');
        updateStatus('等待连接');
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen();
      }
    });

    init();
  </script>
</body>
</html>
