<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 远程控制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
      z-index: 1000;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #e94560;
      font-weight: bold;
      font-size: 18px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #28a745;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.connecting {
      background: #ffc107;
    }

    .status-dot.error {
      background: #dc3545;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toolbar-right {
      display: flex;
      gap: 10px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .toolbar-btn:hover {
      background: #0f3460;
      border-color: #e94560;
    }

    .toolbar-btn.danger {
      border-color: #e94560;
      color: #e94560;
    }

    .toolbar-btn.danger:hover {
      background: #e94560;
      color: #fff;
    }

    #remoteScreen {
      position: absolute;
      top: 0;
      left: 0;
      background: #0f0f23;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100vw;
      height: 100vh;
      z-index: 1;
      transform-origin: center center;
    }

    #videoWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #videoContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #screenVideo {
      display: block;
      background: #000;
      cursor: crosshair;
    }

    #placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      border-radius: 12px;
      z-index: 10;
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .placeholder-text {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .placeholder-subtext {
      font-size: 14px;
      color: #888;
    }

    #clickIndicator {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.6);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 100;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    #clickIndicator.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .info-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 10px 20px;
      border-radius: 20px;
      color: #aaa;
      font-size: 13px;
      display: flex;
      gap: 20px;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      color: #fff;
    }

    #debugLog {
      position: fixed;
      top: 60px;
      right: 10px;
      width: 350px;
      max-height: 300px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      padding: 10px;
      overflow-y: auto;
      border-radius: 5px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="logo">YCDesk</div>
      <div class="connection-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中...</span>
      </div>
    </div>
    <div class="toolbar-right">
      <label style="color: #aaa; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer;">
        <input type="checkbox" id="hideRemoteCursor" checked style="cursor: pointer;">
        隐藏远程鼠标
      </label>
      <button class="toolbar-btn" onclick="toggleDebugLog()">日志</button>
      <button class="toolbar-btn" onclick="toggleFullscreen()">全屏</button>
      <button class="toolbar-btn danger" onclick="disconnect()">断开</button>
    </div>
  </div>

  <div id="remoteScreen">
    <div id="placeholder">
      <div class="placeholder-icon">🖥️</div>
      <div class="placeholder-text">正在建立连接...</div>
      <div class="placeholder-subtext" id="subtext">请稍候</div>
    </div>
    <div id="videoWrapper">
      <div id="videoContainer">
        <video id="screenVideo" autoplay playsinline style="display: none;"></video>
      </div>
      <div id="clickIndicator"></div>
    </div>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <span class="info-label">延迟:</span>
      <span class="info-value" id="latency">-- ms</span>
    </div>
    <div class="info-item">
      <span class="info-label">帧率:</span>
      <span class="info-value" id="fps">-- fps</span>
    </div>
    <div class="info-item">
      <span class="info-label">分辨率:</span>
      <span class="info-value" id="resolution">--</span>
    </div>
    <div class="info-item">
      <span class="info-label">状态:</span>
      <span class="info-value" id="connectionState">--</span>
    </div>
  </div>

  <div id="debugLog"></div>

  <script src="../shared/data-channel-manager.js"></script>
  <script src="../shared/components/matrix-transformer.js"></script>
  <script src="../shared/connection-state-machine.js"></script>
  <script src="../shared/resolution-negotiator.js"></script>
  <script src="../shared/auxiliary-channel-manager.js"></script>
  <script src="../shared/fallback-handler.js"></script>
  <script src="../shared/connection-manager-base.js"></script>
  <script src="../shared/direct-connection-manager.js"></script>
  <script src="../shared/signaling-connection-manager.js"></script>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      log('[全局错误] ' + msg + ' (' + url + ':' + line + ')');
      return false;
    };

    window.onunhandledrejection = function(event) {
      log('[Promise错误] ' + event.reason);
    };

    let videoElement = null;
    let videoContainer = null;
    let videoWrapper = null;
    let remoteScreenEl = null;
    let matrixTransformer = null;
    let connectionManager = null;
    let auxiliaryChannelManager = null;
    let fallbackHandler = null;
    let frameCount = 0;
    let lastTime = performance.now();
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let isMouseDownOnVideo = false;
    let clickIndicator = null;
    let hideRemoteCursorCheckbox = null;
    let connectionMode = 'direct';

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      const logMessage = `[${timestamp}] ${message}`;
      console.log(logMessage);
      
      const debugLog = document.getElementById('debugLog');
      if (debugLog) {
        const div = document.createElement('div');
        div.textContent = logMessage;
        debugLog.appendChild(div);
        debugLog.scrollTop = debugLog.scrollHeight;
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function toggleDebugLog() {
      const debugLog = document.getElementById('debugLog');
      if (debugLog) {
        if (debugLog.style.display === 'none') {
          debugLog.style.display = 'block';
        } else {
          debugLog.style.display = 'none';
        }
      }
    }

    function showClickIndicator(clientX, clientY) {
      if (!clickIndicator) {
        clickIndicator = document.getElementById('clickIndicator');
        if (!clickIndicator) return;
      }
      
      const rect = videoWrapper.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      
      clickIndicator.style.left = x + 'px';
      clickIndicator.style.top = y + 'px';
      clickIndicator.classList.add('show');
      
      setTimeout(() => {
        clickIndicator.classList.remove('show');
      }, 300);
    }

    async function resetInputModifiers() {
      try {
        log('重置输入修饰键状态...');
        await window.electronAPI.resetInputModifiers();
      } catch (e) {
        console.error('重置输入修饰键失败:', e);
      }
    }

    function disconnect() {
      if (confirm('确定要断开连接吗？')) {
        if (connectionManager) {
          connectionManager.disconnect();
        }
        resetInputModifiers();
        window.close();
      }
    }

    function updateStatus(text, state = 'connecting') {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot';
      if (state === 'error') {
        dot.classList.add('error');
      } else if (state === 'connecting') {
        dot.classList.add('connecting');
      }
    }

    function showPlaceholder(text, subtext = '') {
      document.getElementById('placeholder').style.display = 'flex';
      document.getElementById('screenVideo').style.display = 'none';
      document.querySelector('.placeholder-text').textContent = text;
      document.getElementById('subtext').textContent = subtext;
    }

    function showVideo() {
      log('showVideo() called');
      
      document.getElementById('placeholder').style.display = 'none';
      videoElement.style.display = 'block';
      
      if (videoElement.videoWidth && videoElement.videoHeight) {
        videoElement.style.width = videoElement.videoWidth + 'px';
        videoElement.style.height = videoElement.videoHeight + 'px';
        
        document.getElementById('resolution').textContent = 
          `${videoElement.videoWidth}x${videoElement.videoHeight}`;
        
        if (matrixTransformer) {
          matrixTransformer.setRemoteScreenSize(videoElement.videoWidth, videoElement.videoHeight);
        }
      }
      
      if (videoElement.srcObject) {
        videoElement.play().catch(err => {
          log('Video play failed: ' + err.message);
        });
      }
    }

    function updateFps() {
      const now = performance.now();
      const elapsed = (now - lastTime) / 1000;
      if (elapsed >= 1) {
        const fps = Math.round(frameCount / elapsed);
        document.getElementById('fps').textContent = `${fps} fps`;
        frameCount = 0;
        lastTime = now;
      }
    }

    function onVideoFrame() {
      frameCount++;
      updateFps();
      requestAnimationFrame(onVideoFrame);
    }

    function setupMatrixTransformer() {
      try {
        matrixTransformer = new MatrixTransformer();
        
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        matrixTransformer.setScreenSize(viewportWidth, viewportHeight);
        
        const elementRect = remoteScreenEl.getBoundingClientRect();
        matrixTransformer.setElementSize(elementRect.width, elementRect.height);
        
        const center = matrixTransformer.calculateCenterPosition();
        log('MatrixTransformer 初始化完成');
        log('视口尺寸: ' + viewportWidth + 'x' + viewportHeight);
        log('元素尺寸: ' + elementRect.width + 'x' + elementRect.height);
        log('居中位置: (' + center.x + ', ' + center.y + ')');
        
        matrixTransformer.applyTransform(remoteScreenEl);
        
      } catch (error) {
        log('!!! setupMatrixTransformer 出错: ' + error.message);
      }
    }

    function setupPanZoomEvents() {
      log('设置拖动和缩放事件');
      
      remoteScreenEl.addEventListener('mousedown', (e) => {
        if (e.button === 1) {
          isDragging = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          e.preventDefault();
          log('开始拖动');
        }
      });

      remoteScreenEl.addEventListener('mousemove', (e) => {
        if (isDragging && matrixTransformer) {
          const deltaX = e.clientX - lastMouseX;
          const deltaY = e.clientY - lastMouseY;
          matrixTransformer.updatePan(deltaX, deltaY);
          matrixTransformer.applyTransform(remoteScreenEl);
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        }
      });

      remoteScreenEl.addEventListener('mouseup', (e) => {
        if (e.button === 1) {
          isDragging = false;
          log('结束拖动');
        }
      });

      remoteScreenEl.addEventListener('mouseleave', () => {
        isDragging = false;
      });

      remoteScreenEl.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          
          if (!matrixTransformer) return;
          
          const rect = remoteScreenEl.getBoundingClientRect();
          const relX = e.clientX - rect.left;
          const relY = e.clientY - rect.top;
          
          const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
          const newScale = matrixTransformer.scale * scaleFactor;
          
          matrixTransformer.updateScale(newScale, relX, relY);
          matrixTransformer.applyTransform(remoteScreenEl);
          
          log('缩放: scale=' + matrixTransformer.scale.toFixed(2));
        }
      }, { passive: false });
      
      log('拖动和缩放事件设置完成');
    }

    function setupInputEvents() {
      const MOUSE_MOVE_CONFIG = {
        MIN_INTERVAL_MS: 8,
        MIN_DISTANCE_PX: 2,
        IDLE_TIMEOUT_MS: 100,
        SMOOTH_FACTOR: 0.6
      };

      const BLOCKED_SHORTCUTS = [
        'Alt+Tab',
        'Alt+F4',
        'Ctrl+Alt+Delete',
        'Meta+D',
        'Meta+Tab'
      ];

      let lastMoveTime = 0;
      let lastMoveX = 0;
      let lastMoveY = 0;
      let accumulatedDeltaX = 0;
      let accumulatedDeltaY = 0;
      let moveSendTimer = null;
      let idleTimer = null;
      let sequenceId = 0;
      let accumulatedWheelDeltaY = 0;
      let accumulatedWheelDeltaX = 0;
      let wheelSendTimer = null;
      const WHEEL_BATCH_INTERVAL_MS = 16;
      
      let smoothedDeltaX = 0;
      let smoothedDeltaY = 0;
      
      function smoothDelta(dx, dy) {
        smoothedDeltaX = smoothedDeltaX + (dx - smoothedDeltaX) * MOUSE_MOVE_CONFIG.SMOOTH_FACTOR;
        smoothedDeltaY = smoothedDeltaY + (dy - smoothedDeltaY) * MOUSE_MOVE_CONFIG.SMOOTH_FACTOR;
        return {
          dx: Math.round(smoothedDeltaX),
          dy: Math.round(smoothedDeltaY)
        };
      }
      
      function getShortcutKey(e) {
        let shortcut = '';
        if (e.ctrlKey) shortcut += 'Ctrl+';
        if (e.altKey) shortcut += 'Alt+';
        if (e.shiftKey) shortcut += 'Shift+';
        if (e.metaKey) shortcut += 'Meta+';
        shortcut += e.key;
        return shortcut;
      }
      
      function shouldBlockShortcut(e) {
        const shortcut = getShortcutKey(e);
        return BLOCKED_SHORTCUTS.includes(shortcut);
      }
      
      function flushMouseDelta() {
        if (accumulatedDeltaX === 0 && accumulatedDeltaY === 0) return;
        
        const smoothed = smoothDelta(accumulatedDeltaX, accumulatedDeltaY);
        
        connectionManager.sendInput({
          inputType: 'mousemove_delta',
          dx: smoothed.dx,
          dy: smoothed.dy,
          sequenceId: sequenceId++
        });
        
        accumulatedDeltaX = 0;
        accumulatedDeltaY = 0;
        lastMoveTime = Date.now();
      }
      
      function flushWheelAccumulated() {
        if (accumulatedWheelDeltaY === 0 && accumulatedWheelDeltaX === 0) return;
        
        connectionManager.sendInput({
          inputType: 'wheel_batch',
          accumulatedDeltaY: accumulatedWheelDeltaY,
          accumulatedDeltaX: accumulatedWheelDeltaX,
          x: 0.5,
          y: 0.5
        });
        
        accumulatedWheelDeltaY = 0;
        accumulatedWheelDeltaX = 0;
      }

      videoWrapper.addEventListener('mousedown', (e) => {
        if (e.button === 1) return;
        
        showClickIndicator(e.clientX, e.clientY);
        flushMouseDelta();
        flushWheelAccumulated();
        
        if (!matrixTransformer) return;
        
        const containerRect = videoContainer.getBoundingClientRect();
        const localX = e.clientX - containerRect.left;
        const localY = e.clientY - containerRect.top;
        
        if (localX >= 0 && localX <= containerRect.width &&
            localY >= 0 && localY <= containerRect.height) {
          const ratioX = localX / containerRect.width;
          const ratioY = localY / containerRect.height;
          
          isMouseDownOnVideo = true;
          lastMoveX = ratioX;
          lastMoveY = ratioY;
          connectionManager.sendInput({
            inputType: 'mousedown',
            button: e.button,
            x: Math.max(0, Math.min(1, ratioX)),
            y: Math.max(0, Math.min(1, ratioY))
          });
        }
      });

      videoWrapper.addEventListener('mousemove', (e) => {
        if (isDragging) return;
        if (!matrixTransformer) return;
        
        if (idleTimer) {
          clearTimeout(idleTimer);
          idleTimer = null;
        }
        
        const containerRect = videoContainer.getBoundingClientRect();
        const localX = e.clientX - containerRect.left;
        const localY = e.clientY - containerRect.top;
        
        const ratioX = localX / containerRect.width;
        const ratioY = localY / containerRect.height;
        
        const currentX = ratioX;
        const currentY = ratioY;
        
        const now = Date.now();
        const timeSinceLastMove = now - lastMoveTime;
        const distance = Math.sqrt(
          Math.pow(currentX - lastMoveX, 2) + Math.pow(currentY - lastMoveY, 2)
        );
        
        const remoteDeltaX = (currentX - lastMoveX) * matrixTransformer.remoteScreenWidth;
        const remoteDeltaY = (currentY - lastMoveY) * matrixTransformer.remoteScreenHeight;
        
        accumulatedDeltaX += remoteDeltaX;
        accumulatedDeltaY += remoteDeltaY;
        
        lastMoveX = currentX;
        lastMoveY = currentY;
        
        if (timeSinceLastMove >= MOUSE_MOVE_CONFIG.MIN_INTERVAL_MS && 
            distance >= MOUSE_MOVE_CONFIG.MIN_DISTANCE_PX) {
          flushMouseDelta();
        }
        
        if (!moveSendTimer) {
          moveSendTimer = setInterval(() => {
            if (accumulatedDeltaX !== 0 || accumulatedDeltaY !== 0) {
              flushMouseDelta();
            }
          }, MOUSE_MOVE_CONFIG.MIN_INTERVAL_MS);
        }
        
        idleTimer = setTimeout(() => {
          if (accumulatedDeltaX !== 0 || accumulatedDeltaY !== 0) {
            flushMouseDelta();
          }
          idleTimer = null;
        }, MOUSE_MOVE_CONFIG.IDLE_TIMEOUT_MS);
      });

      videoWrapper.addEventListener('mouseup', (e) => {
        if (e.button === 1) return;
        
        flushMouseDelta();
        flushWheelAccumulated();
        
        if (!isMouseDownOnVideo || !matrixTransformer) return;
        
        isMouseDownOnVideo = false;
        
        const containerRect = videoContainer.getBoundingClientRect();
        let localX = e.clientX - containerRect.left;
        let localY = e.clientY - containerRect.top;
        
        localX = Math.max(0, Math.min(containerRect.width, localX));
        localY = Math.max(0, Math.min(containerRect.height, localY));
        
        const ratioX = localX / containerRect.width;
        const ratioY = localY / containerRect.height;
        
        connectionManager.sendInput({
          inputType: 'mouseup',
          button: e.button,
          x: ratioX,
          y: ratioY
        });
      });

      videoWrapper.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) return;
        
        e.preventDefault();
        
        if (!matrixTransformer) return;
        
        const containerRect = videoContainer.getBoundingClientRect();
        const localX = e.clientX - containerRect.left;
        const localY = e.clientY - containerRect.top;
        
        const ratioX = localX / containerRect.width;
        const ratioY = localY / containerRect.height;
        
        accumulatedWheelDeltaY += e.deltaY;
        accumulatedWheelDeltaX += e.deltaX || 0;
        
        if (wheelSendTimer) {
          clearTimeout(wheelSendTimer);
        }
        
        wheelSendTimer = setTimeout(() => {
          if (accumulatedWheelDeltaY !== 0 || accumulatedWheelDeltaX !== 0) {
            connectionManager.sendInput({
              inputType: 'wheel_batch',
              accumulatedDeltaY: accumulatedWheelDeltaY,
              accumulatedDeltaX: accumulatedWheelDeltaX,
              x: ratioX,
              y: ratioY
            });
            accumulatedWheelDeltaY = 0;
            accumulatedWheelDeltaX = 0;
          }
          wheelSendTimer = null;
        }, WHEEL_BATCH_INTERVAL_MS);
      }, { passive: false });

      videoWrapper.addEventListener('mouseleave', () => {
        isMouseDownOnVideo = false;
      });

      videoWrapper.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      videoWrapper.addEventListener('keydown', (e) => {
        if (shouldBlockShortcut(e)) {
          log('阻止系统快捷键: ' + getShortcutKey(e));
          e.preventDefault();
          return;
        }
        
        e.preventDefault();
        connectionManager.sendInput({
          inputType: 'keydown',
          key: e.key,
          code: e.code,
          keyCode: e.keyCode,
          ctrlKey: e.ctrlKey,
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          metaKey: e.metaKey
        });
      });

      videoWrapper.addEventListener('keyup', (e) => {
        if (shouldBlockShortcut(e)) {
          e.preventDefault();
          return;
        }
        
        e.preventDefault();
        connectionManager.sendInput({
          inputType: 'keyup',
          key: e.key,
          code: e.code,
          keyCode: e.keyCode,
          ctrlKey: e.ctrlKey,
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          metaKey: e.metaKey
        });
      });

      videoWrapper.setAttribute('tabindex', '0');
      videoWrapper.focus();
      
      hideRemoteCursorCheckbox = document.getElementById('hideRemoteCursor');
      if (hideRemoteCursorCheckbox) {
        hideRemoteCursorCheckbox.addEventListener('change', (e) => {
          if (connectionManager && connectionManager.dataChannelManager && 
              connectionManager.dataChannelManager.isOpen()) {
            connectionManager.dataChannelManager.send({ type: 'hide-cursor', hide: e.target.checked });
            log('发送隐藏鼠标指令: ' + e.target.checked);
          }
        });
      }

      log('输入事件监听已设置');
    }

    function setupTouchEvents() {
      let touchStartDistance = 0;
      let touchStartScale = 1;
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartPanX = 0;
      let touchStartPanY = 0;
      
      function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      
      function getTouchCenter(touches) {
        return {
          x: (touches[0].clientX + touches[1].clientX) / 2,
          y: (touches[0].clientY + touches[1].clientY) / 2
        };
      }
      
      remoteScreenEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          touchStartDistance = getTouchDistance(e.touches);
          touchStartScale = matrixTransformer.scale;
          const center = getTouchCenter(e.touches);
          touchStartX = center.x;
          touchStartY = center.y;
          touchStartPanX = matrixTransformer.panX;
          touchStartPanY = matrixTransformer.panY;
          log('双指触摸开始');
        } else if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartPanX = matrixTransformer.panX;
          touchStartPanY = matrixTransformer.panY;
        }
      }, { passive: false });
      
      remoteScreenEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          
          const currentDistance = getTouchDistance(e.touches);
          const scale = touchStartScale * (currentDistance / touchStartDistance);
          const clampedScale = Math.max(0.5, Math.min(3.0, scale));
          
          matrixTransformer.scale = clampedScale;
          matrixTransformer._matrixDirty = true;
          matrixTransformer.applyTransform(remoteScreenEl);
          
        } else if (e.touches.length === 1) {
          e.preventDefault();
          
          const deltaX = e.touches[0].clientX - touchStartX;
          const deltaY = e.touches[0].clientY - touchStartY;
          
          matrixTransformer.panX = touchStartPanX + deltaX;
          matrixTransformer.panY = touchStartPanY + deltaY;
          matrixTransformer._matrixDirty = true;
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }, { passive: false });
      
      remoteScreenEl.addEventListener('touchend', (e) => {
        if (e.touches.length < 2) {
          log('触摸结束');
        }
      });
      
      log('触摸事件已设置');
    }

    function setupPerformanceMonitor() {
      const stats = {
        fps: 0,
        frameCount: 0,
        lastTime: performance.now(),
        latency: 0,
        bytesReceived: 0,
        packetsLost: 0
      };
      
      function updateStats() {
        const now = performance.now();
        const elapsed = (now - stats.lastTime) / 1000;
        
        if (elapsed >= 1) {
          stats.fps = Math.round(stats.frameCount / elapsed);
          stats.frameCount = 0;
          stats.lastTime = now;
          
          document.getElementById('fps').textContent = stats.fps + ' fps';
        }
        
        requestAnimationFrame(updateStats);
      }
      
      if (videoElement) {
        videoElement.addEventListener('timeupdate', () => {
          stats.frameCount++;
        });
      }
      
      setInterval(async () => {
        if (connectionManager && connectionManager.peerConnection) {
          const stats2 = await connectionManager.peerConnection.getStats();
          stats2.forEach(report => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              stats.bytesReceived = report.bytesReceived || 0;
              stats.packetsLost = report.packetsLost || 0;
            }
          });
        }
      }, 1000);
      
      updateStats();
      log('性能监控已启动');
    }

    async function init() {
      videoElement = document.getElementById('screenVideo');
      videoContainer = document.getElementById('videoContainer');
      videoWrapper = document.getElementById('videoWrapper');
      remoteScreenEl = document.getElementById('remoteScreen');
      
      log('远程窗口初始化开始');
      
      setupMatrixTransformer();
      setupPanZoomEvents();
      setupTouchEvents();
      setupPerformanceMonitor();
      
      window.electronAPI.on('signaling-mode-start', async (data) => {
        connectionMode = 'signaling';
        log('信令模式启动');
        
        connectionManager = new SignalingConnectionManager();
        setupConnectionManagerEvents();
        
        connectionManager.setVideoElements(videoElement, videoContainer, videoWrapper, remoteScreenEl);
        connectionManager.setMatrixTransformer(matrixTransformer);
        
        try {
          await connectionManager.connect({
            signalingUrl: data.signalingUrl,
            credentials: {
              token: data.token,
              deviceId: data.deviceId
            }
          });
        } catch (error) {
          log('信令模式连接失败: ' + error.message);
          updateStatus('连接失败', 'error');
        }
      });
      
      window.electronAPI.on('direct-mode-start', async (data) => {
        if (connectionManager) return;
        
        connectionMode = 'direct';
        log('直连模式启动');
        log('收到数据: ' + JSON.stringify(data));
        
        try {
          connectionManager = new DirectConnectionManager();
          log('DirectConnectionManager 创建成功');
          
          connectionManager.setModeData(data);
          log('setModeData 完成');
          
          setupConnectionManagerEvents();
          log('setupConnectionManagerEvents 完成');
          
          connectionManager.setVideoElements(videoElement, videoContainer, videoWrapper, remoteScreenEl);
          log('setVideoElements 完成');
          
          connectionManager.setMatrixTransformer(matrixTransformer);
          log('setMatrixTransformer 完成');
          
          log('开始调用 connectionManager.connect()...');
          await connectionManager.connect({});
          log('connectionManager.connect() 完成');
        } catch (error) {
          log('直连模式连接失败: ' + error.message);
          console.error('连接错误详情:', error);
          updateStatus('连接失败', 'error');
        }
      });
      
      window.electronAPI.send('remote-window-ready', {});
      
      try {
        const screenSize = await window.electronAPI.getScreenSize();
        document.getElementById('resolution').textContent = `${screenSize.width}x${screenSize.height}`;
      } catch (error) {
        log('获取屏幕尺寸失败: ' + error.message);
      }
      
      updateStatus('正在连接...');
      showPlaceholder('正在建立连接...', '请稍候');
    }

    function setupConnectionManagerEvents() {
      connectionManager.on('log', (message) => {
        log(message);
      });
      
      connectionManager.on('error', (data) => {
        log('错误: ' + data.message);
        updateStatus('连接错误', 'error');
      });
      
      connectionManager.on('latency', (latency) => {
        document.getElementById('latency').textContent = `${latency} ms`;
      });
      
      connectionManager.on('video-metadata', (data) => {
        log(`视频元数据: ${data.width}x${data.height}`);
        showVideo();
        updateStatus('已连接');
        requestAnimationFrame(onVideoFrame);
        setupInputEvents();
        connectionManager.startLatencyCheck();
      });
      
      connectionManager.on('video-ready', () => {
        log('视频准备就绪');
      });
      
      connectionManager.on('data-channel-open', () => {
        log('数据通道已打开');
        
        initAuxiliaryChannels();
      });
      
      connectionManager.on('auxiliary-channel-ready', (data) => {
        log(`辅助通道 ${data.name} 就绪`);
      });
      
      connectionManager.on('auxiliary-channel-error', (data) => {
        log(`辅助通道 ${data.name} 错误: ${data.error.message}`);
      });
      
      connectionManager.stateMachine.addListener((newState, oldState, data) => {
        document.getElementById('connectionState').textContent = newState;
        
        switch (newState) {
          case 'connecting':
            updateStatus('正在连接...', 'connecting');
            showPlaceholder('正在建立连接...', '请稍候');
            break;
          case 'authenticating':
            showPlaceholder('正在验证身份...', '请稍候');
            break;
          case 'resolution-negotiating':
            showPlaceholder('正在协商分辨率...', '请稍候');
            break;
          case 'waiting-video':
            showPlaceholder('等待视频流...', '请稍候');
            break;
          case 'connected':
            updateStatus('已连接');
            break;
          case 'error':
            updateStatus('连接失败', 'error');
            showPlaceholder('连接失败', data?.error || '未知错误');
            break;
        }
      });
    }
    
    function initAuxiliaryChannels() {
      log('初始化辅助通道管理器');
      
      auxiliaryChannelManager = new AuxiliaryChannelManager({ logger: { log: log, error: console.error } });
      auxiliaryChannelManager.setPeerConnection(connectionManager.peerConnection);
      auxiliaryChannelManager.setDataChannelManager(connectionManager.dataChannelManager);
      
      fallbackHandler = new FallbackHandler({ logger: { log: log, error: console.error } });
      fallbackHandler.setAuxiliaryChannelManager(auxiliaryChannelManager);
      
      auxiliaryChannelManager.on('channel-ready', (data) => {
        log(`辅助通道就绪: ${data.type}`);
        updateAuxiliaryStatus(data.type, 'ready');
      });
      
      auxiliaryChannelManager.on('channel-closed', (data) => {
        log(`辅助通道关闭: ${data.type}`);
        updateAuxiliaryStatus(data.type, 'closed');
      });
      
      auxiliaryChannelManager.on('clipboard-sync', (content) => {
        handleClipboardSync(content);
      });
      
      fallbackHandler.on('user-notification', (notification) => {
        showUserNotification(notification);
      });
      
      fallbackHandler.on('fallback-executed', (data) => {
        log(`降级策略执行: ${data.channelType} -> ${data.strategy}`);
        updateAuxiliaryStatus(data.channelType, 'fallback');
      });
      
      fallbackHandler.on('retry-success', (data) => {
        log(`辅助通道重试成功: ${data.channelType}`);
        updateAuxiliaryStatus(data.channelType, 'ready');
      });
      
      fallbackHandler.on('retry-failed', (data) => {
        log(`辅助通道重试失败: ${data.channelType}`);
      });
    }
    
    function loadAuxiliaryChannelsAsync() {
      if (!auxiliaryChannelManager) {
        log('辅助通道管理器未初始化');
        return;
      }
      
      log('开始并行加载辅助通道');
      
      auxiliaryChannelManager.loadAllParallel([
        AuxiliaryChannelType.CLIPBOARD
      ]).then(result => {
        log(`辅助通道加载完成: 成功=${result.success}, 失败=${result.failed}`);
      });
    }
    
    function updateAuxiliaryStatus(channelType, status) {
      const statusEl = document.getElementById('auxiliaryStatus');
      if (statusEl) {
        const statuses = JSON.parse(statusEl.textContent || '{}');
        statuses[channelType] = status;
        statusEl.textContent = JSON.stringify(statuses);
      }
    }
    
    function handleClipboardSync(content) {
      log('收到剪贴板同步');
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(content).then(() => {
          log('剪贴板内容已同步到本地');
        }).catch(err => {
          log('剪贴板同步失败: ' + err.message);
        });
      }
    }
    
    function showUserNotification(notification) {
      log(`[通知] ${notification.message}`);
      
      const notificationEl = document.createElement('div');
      notificationEl.className = `notification notification-${notification.severity}`;
      notificationEl.innerHTML = `
        <span class="notification-message">${notification.message}</span>
        <button class="notification-dismiss" onclick="this.parentElement.remove()">×</button>
      `;
      notificationEl.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: ${notification.severity === 'warning' ? '#ff9800' : '#2196f3'};
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 10px;
      `;
      
      document.body.appendChild(notificationEl);
      
      setTimeout(() => {
        notificationEl.remove();
      }, 5000);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen();
      }
      
      if (e.ctrlKey && e.key === '0') {
        e.preventDefault();
        if (matrixTransformer) {
          matrixTransformer.resetView();
          matrixTransformer.applyTransform(remoteScreenEl);
          log('视图已重置');
        }
      }
      
      if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        if (matrixTransformer) {
          matrixTransformer.resetView();
          matrixTransformer.applyTransform(remoteScreenEl);
          log('视图已重置');
        }
      }
      
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    init();
  </script>
</body>
</html>
