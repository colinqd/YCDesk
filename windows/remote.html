<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YCDesk - 远程控制</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      overflow: hidden;
      height: 100vh;
    }

    .toolbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #16213e;
      padding: 10px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #0f3460;
      z-index: 1000;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .logo {
      color: #e94560;
      font-weight: bold;
      font-size: 18px;
    }

    .connection-status {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #aaa;
      font-size: 14px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background: #28a745;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.connecting {
      background: #ffc107;
    }

    .status-dot.error {
      background: #dc3545;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .toolbar-right {
      display: flex;
      gap: 10px;
    }

    .toolbar-btn {
      background: transparent;
      border: 1px solid #0f3460;
      color: #fff;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      transition: all 0.3s;
    }

    .toolbar-btn:hover {
      background: #0f3460;
      border-color: #e94560;
    }

    .toolbar-btn.danger {
      border-color: #e94560;
      color: #e94560;
    }

    .toolbar-btn.danger:hover {
      background: #e94560;
      color: #fff;
    }

    #remoteScreen {
      position: absolute;
      top: 0;
      left: 0;
      background: #0f0f23;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      width: 100vw;
      height: 100vh;
      z-index: 1;
      transform-origin: center center;
    }

    #videoWrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #videoContainer {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #screenVideo {
      display: block;
      background: #000;
      cursor: crosshair;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    /* 解锁面板样式 */
    #unlockOverlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(5px);
    }

    #unlockOverlay.hidden {
      display: none;
    }

    .unlock-dialog {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      border: 1px solid #0f3460;
      border-radius: 16px;
      padding: 40px;
      width: 400px;
      max-width: 90%;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    }

    .unlock-dialog h2 {
      color: #fff;
      margin-bottom: 8px;
      text-align: center;
      font-size: 24px;
    }

    .unlock-dialog p {
      color: #aaa;
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .unlock-input-group {
      margin-bottom: 20px;
    }

    .unlock-input-group label {
      display: block;
      color: #fff;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .unlock-input {
      width: 100%;
      padding: 14px 16px;
      background: #0f3460;
      border: 1px solid #1a4a7a;
      border-radius: 8px;
      color: #fff;
      font-size: 16px;
      outline: none;
      transition: all 0.3s;
    }

    .unlock-input:focus {
      border-color: #e94560;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.1);
    }

    .unlock-remember-group {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 24px;
    }

    .unlock-remember-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
    }

    .unlock-remember-group label {
      color: #aaa;
      font-size: 14px;
      cursor: pointer;
    }

    .unlock-buttons {
      display: flex;
      gap: 12px;
    }

    .unlock-btn {
      flex: 1;
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .unlock-btn-primary {
      background: #e94560;
      color: #fff;
    }

    .unlock-btn-primary:hover {
      background: #ff5a75;
    }

    .unlock-btn-secondary {
      background: #0f3460;
      color: #fff;
      border: 1px solid #1a4a7a;
    }

    .unlock-btn-secondary:hover {
      background: #1a4a7a;
    }

    .unlock-message {
      margin-top: 16px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
      display: none;
    }

    .unlock-message.success {
      display: block;
      background: rgba(40, 167, 69, 0.2);
      color: #28a745;
    }

    .unlock-message.error {
      display: block;
      background: rgba(220, 53, 69, 0.2);
      color: #dc3545;
    }

    #placeholder {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #666;
      border-radius: 12px;
      z-index: 10;
    }

    .placeholder-icon {
      font-size: 64px;
      margin-bottom: 20px;
    }

    .placeholder-text {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .placeholder-subtext {
      font-size: 14px;
      color: #888;
    }

    #clickIndicator {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(233, 69, 96, 0.6);
      pointer-events: none;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
      z-index: 100;
      transition: transform 0.3s ease-out, opacity 0.3s ease-out;
    }

    #clickIndicator.show {
      transform: translate(-50%, -50%) scale(1);
      opacity: 1;
    }

    .info-bar {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(22, 33, 62, 0.95);
      padding: 10px 20px;
      border-radius: 20px;
      color: #aaa;
      font-size: 13px;
      display: flex;
      gap: 20px;
      backdrop-filter: blur(10px);
      z-index: 1000;
    }

    .info-item {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .info-label {
      color: #666;
    }

    .info-value {
      color: #fff;
    }

    #debugLog {
      position: fixed;
      top: 60px;
      right: 10px;
      width: 350px;
      max-height: 300px;
      background: rgba(0,0,0,0.8);
      color: #0f0;
      font-family: monospace;
      font-size: 11px;
      overflow-y: auto;
      border-radius: 5px;
      z-index: 9999;
      display: flex;
      flex-direction: column;
    }
    
    #debugLogContent {
      flex: 1;
      padding: 10px;
      overflow-y: auto;
      user-select: text;
    }
    
    #debugLogToolbar {
      display: flex;
      gap: 5px;
      padding: 8px 10px;
      border-top: 1px solid #333;
      background: rgba(0,0,0,0.5);
    }
    
    .log-btn {
      background: #333;
      border: 1px solid #555;
      color: #ccc;
      padding: 4px 10px;
      border-radius: 3px;
      cursor: pointer;
      font-size: 11px;
      transition: all 0.2s;
    }
    
    .log-btn:hover {
      background: #444;
      border-color: #666;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="toolbar-left">
      <div class="logo">YCDesk</div>
      <div class="connection-status">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusText">连接中...</span>
      </div>
    </div>
    <div class="toolbar-right">
      <select id="resolutionSelect" style="background: #333; color: #ccc; border: 1px solid #555; border-radius: 4px; padding: 4px 8px; font-size: 12px; cursor: pointer;">
        <option value="auto">自动分辨率</option>
        <option value="1920x1080">1920x1080</option>
        <option value="1600x900">1600x900</option>
        <option value="1280x720">1280x720</option>
        <option value="1024x768">1024x768</option>
        <option value="800x600">800x600</option>
      </select>
      <button class="toolbar-btn" onclick="openUnlockPanel()">🔓 解锁</button>
      <button class="toolbar-btn" onclick="toggleDebugLog()">日志</button>
      <button class="toolbar-btn" onclick="toggleFullscreen()">全屏</button>
      <button class="toolbar-btn danger" onclick="disconnect()">断开</button>
    </div>
  </div>

  <div id="remoteScreen">
    <div id="placeholder">
      <div class="placeholder-icon">🖥️</div>
      <div class="placeholder-text">正在建立连接...</div>
      <div class="placeholder-subtext" id="subtext">请稍候</div>
    </div>
    <div id="videoWrapper">
      <div id="videoContainer">
        <video id="screenVideo" autoplay playsinline style="display: none;"></video>
        <canvas id="optimizedCanvas" style="display: none; width: 100%; height: 100%; object-fit: contain; cursor: crosshair;"></canvas>
      </div>
      <div id="clickIndicator"></div>
    </div>
  </div>

  <div class="info-bar">
    <div class="info-item">
      <span class="info-label">延迟:</span>
      <span class="info-value" id="latency">-- ms</span>
    </div>
    <div class="info-item">
      <span class="info-label">帧率:</span>
      <span class="info-value" id="fps">-- fps</span>
    </div>
    <div class="info-item">
      <span class="info-label">分辨率:</span>
      <span class="info-value" id="resolution">--</span>
    </div>
    <div class="info-item">
      <span class="info-label">状态:</span>
      <span class="info-value" id="connectionState">--</span>
    </div>
  </div>

  <div id="debugLog">
    <div id="debugLogContent"></div>
    <div id="debugLogToolbar">
      <button class="log-btn" onclick="copyAllLogs()">全部复制</button>
      <button class="log-btn" onclick="copySelectedLogs()">选择复制</button>
      <button class="log-btn" onclick="clearLogs()">清空</button>
    </div>
  </div>

  <script src="shared/data-channel-manager.js"></script>
  <script src="shared/input-protocol.js"></script>
  <script src="src/renderer/js/video-frame-receiver.js"></script>
  <script src="src/renderer/js/remote-video-handler.js"></script>
  <script src="shared/components/matrix-transformer.js"></script>
  <script src="shared/connection-state-machine.js"></script>
  <script src="shared/resolution-negotiator.js"></script>
  <script src="shared/auxiliary-channel-manager.js"></script>
  <script src="shared/fallback-handler.js"></script>
  <script src="shared/connection-manager-base.js"></script>
  <script src="shared/direct-connection-manager.js"></script>
  <script src="shared/signaling-connection-manager.js"></script>
  <script>
    window.onerror = function(msg, url, line, col, error) {
      log('[全局错误] ' + msg + ' (' + url + ':' + line + ')');
      return false;
    };

    window.onunhandledrejection = function(event) {
      log('[Promise错误] ' + event.reason);
    };

    let videoElement = null;
    let videoContainer = null;
    let videoWrapper = null;
    let remoteScreenEl = null;
    let matrixTransformer = null;
    let connectionManager = null;
    let auxiliaryChannelManager = null;
    let fallbackHandler = null;
    let inputEventsSetup = false;
    let frameCount = 0;
    let lastTime = performance.now();
    let isDragging = false;
    let lastMouseX = 0;
    let lastMouseY = 0;
    let isMouseDownOnVideo = false;
    let clickIndicator = null;
    let connectionMode = 'direct';
    let remoteVideoHandler = null;

    function log(message) {
      const timestamp = new Date().toLocaleTimeString();
      const logMessage = `[${timestamp}] ${message}`;
      console.log(logMessage);
      
      const debugLogContent = document.getElementById('debugLogContent');
      if (debugLogContent) {
        const div = document.createElement('div');
        div.textContent = logMessage;
        debugLogContent.appendChild(div);
        debugLogContent.scrollTop = debugLogContent.scrollHeight;
      }
    }

    function copyAllLogs() {
      const debugLogContent = document.getElementById('debugLogContent');
      if (debugLogContent) {
        const text = Array.from(debugLogContent.children)
          .map(el => el.textContent)
          .join('\n');
        navigator.clipboard.writeText(text).then(() => {
          alert('已复制全部日志');
        }).catch(err => {
          console.error('复制失败:', err);
        });
      }
    }

    function copySelectedLogs() {
      const selection = window.getSelection();
      const selectedText = selection.toString();
      if (selectedText) {
        navigator.clipboard.writeText(selectedText).then(() => {
          alert('已复制选中内容');
        }).catch(err => {
          console.error('复制失败:', err);
        });
      } else {
        alert('请先选择要复制的内容');
      }
    }

    function clearLogs() {
      const debugLogContent = document.getElementById('debugLogContent');
      if (debugLogContent) {
        debugLogContent.innerHTML = '';
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function toggleDebugLog() {
      const debugLog = document.getElementById('debugLog');
      if (debugLog) {
        if (debugLog.style.display === 'none') {
          debugLog.style.display = 'block';
        } else {
          debugLog.style.display = 'none';
        }
      }
    }

    function showClickIndicator(clientX, clientY) {
      if (!clickIndicator) {
        clickIndicator = document.getElementById('clickIndicator');
        if (!clickIndicator) return;
      }
      
      const rect = videoWrapper.getBoundingClientRect();
      const x = clientX - rect.left;
      const y = clientY - rect.top;
      
      clickIndicator.style.left = x + 'px';
      clickIndicator.style.top = y + 'px';
      clickIndicator.classList.add('show');
      
      setTimeout(() => {
        clickIndicator.classList.remove('show');
      }, 300);
    }

    async function resetInputModifiers() {
      try {
        log('重置输入修饰键状态...');
        await window.electronAPI.resetInputModifiers();
      } catch (e) {
        console.error('重置输入修饰键失败:', e);
      }
    }

    function disconnect() {
      if (confirm('确定要断开连接吗？')) {
        if (connectionManager) {
          connectionManager.disconnect();
        }
        resetInputModifiers();
        window.close();
      }
    }

    function updateStatus(text, state = 'connecting') {
      document.getElementById('statusText').textContent = text;
      const dot = document.getElementById('statusDot');
      dot.className = 'status-dot';
      if (state === 'error') {
        dot.classList.add('error');
      } else if (state === 'connecting') {
        dot.classList.add('connecting');
      }
    }

    function showPlaceholder(text, subtext = '') {
      document.getElementById('placeholder').style.display = 'flex';
      document.getElementById('screenVideo').style.display = 'none';
      document.querySelector('.placeholder-text').textContent = text;
      document.getElementById('subtext').textContent = subtext;
    }

    function showVideo() {
      document.getElementById('placeholder').style.display = 'none';
      videoElement.style.display = 'block';
      
      if (videoElement.videoWidth && videoElement.videoHeight) {
        document.getElementById('resolution').textContent = 
          `${videoElement.videoWidth}x${videoElement.videoHeight}`;
        
        if (matrixTransformer) {
          matrixTransformer.setRemoteScreenSize(videoElement.videoWidth, videoElement.videoHeight);
        }
      }
      
      if (videoElement.srcObject) {
        videoElement.play().catch(err => {
          log('Video play failed: ' + err.message);
        });
      }
      
      if (videoWrapper) {
        videoWrapper.focus();
      }
    }

    function updateFps() {
      const now = performance.now();
      const elapsed = (now - lastTime) / 1000;
      if (elapsed >= 1) {
        const fps = Math.round(frameCount / elapsed);
        document.getElementById('fps').textContent = `${fps} fps`;
        frameCount = 0;
        lastTime = now;
      }
    }

    function onVideoFrame() {
      frameCount++;
      updateFps();
      requestAnimationFrame(onVideoFrame);
    }

    function setupMatrixTransformer() {
      try {
        matrixTransformer = new MatrixTransformer();
        
        const viewportWidth = window.innerWidth;
        const viewportHeight = window.innerHeight;
        matrixTransformer.setScreenSize(viewportWidth, viewportHeight);
        
        const elementRect = remoteScreenEl.getBoundingClientRect();
        matrixTransformer.setElementSize(elementRect.width, elementRect.height);
        
        const center = matrixTransformer.calculateCenterPosition();
        
        matrixTransformer.applyTransform(remoteScreenEl);
        
      } catch (error) {
        log('setupMatrixTransformer 出错: ' + error.message);
      }
    }

    function setupPanZoomEvents() {
      remoteScreenEl.addEventListener('mousedown', (e) => {
        if (e.button === 1) {
          isDragging = true;
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
          e.preventDefault();
        }
      });

      remoteScreenEl.addEventListener('mousemove', (e) => {
        if (isDragging && matrixTransformer) {
          const deltaX = e.clientX - lastMouseX;
          const deltaY = e.clientY - lastMouseY;
          matrixTransformer.updatePan(deltaX, deltaY);
          matrixTransformer.applyTransform(remoteScreenEl);
          lastMouseX = e.clientX;
          lastMouseY = e.clientY;
        }
      });

      remoteScreenEl.addEventListener('mouseup', (e) => {
        if (e.button === 1) {
          isDragging = false;
        }
      });

      remoteScreenEl.addEventListener('mouseleave', () => {
        isDragging = false;
      });

      remoteScreenEl.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          
          if (!matrixTransformer) return;
          
          const scaleFactor = e.deltaY > 0 ? 0.9 : 1.1;
          const newScale = matrixTransformer.scale * scaleFactor;
          
          matrixTransformer.updateScale(newScale, e.clientX, e.clientY);
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }, { passive: false });
    }

    function setupInputEvents() {
      if (inputEventsSetup) return;
      inputEventsSetup = true;
      log('setupInputEvents 初始化');
      
      const MOUSE_MOVE_CONFIG = {
        MIN_INTERVAL_MS: 8,
        MIN_DISTANCE_PX: 1,
        IDLE_TIMEOUT_MS: 100
      };

      const BLOCKED_SHORTCUTS = [
        'Alt+Tab',
        'Alt+F4',
        'Ctrl+Alt+Delete',
        'Meta+D',
        'Meta+Tab'
      ];

      let lastMoveTime = 0;
      let lastMoveX = 0;
      let lastMoveY = 0;
      let accumulatedDeltaX = 0;
      let accumulatedDeltaY = 0;
      let moveSendTimer = null;
      let idleTimer = null;
      let sequenceId = 0;
      let accumulatedWheelDeltaY = 0;
      let accumulatedWheelDeltaX = 0;
      let wheelSendTimer = null;
      const WHEEL_BATCH_INTERVAL_MS = 16;
      
      function getShortcutKey(e) {
        let shortcut = '';
        if (e.ctrlKey) shortcut += 'Ctrl+';
        if (e.altKey) shortcut += 'Alt+';
        if (e.shiftKey) shortcut += 'Shift+';
        if (e.metaKey) shortcut += 'Meta+';
        shortcut += e.key;
        return shortcut;
      }
      
      function shouldBlockShortcut(e) {
        const shortcut = getShortcutKey(e);
        return BLOCKED_SHORTCUTS.includes(shortcut);
      }
      
      function flushMouseDelta() {
        if (accumulatedDeltaX === 0 && accumulatedDeltaY === 0) return;
        
        connectionManager.sendInput({
          inputType: 'mousemove_delta',
          dx: Math.round(accumulatedDeltaX),
          dy: Math.round(accumulatedDeltaY),
          sequenceId: sequenceId++
        });
        
        accumulatedDeltaX = 0;
        accumulatedDeltaY = 0;
        lastMoveTime = Date.now();
      }
      
      function flushWheelAccumulated() {
        if (accumulatedWheelDeltaY === 0 && accumulatedWheelDeltaX === 0) return;
        
        connectionManager.sendInput({
          inputType: 'wheel_batch',
          accumulatedDeltaY: accumulatedWheelDeltaY,
          accumulatedDeltaX: accumulatedWheelDeltaX,
          x: 0.5,
          y: 0.5
        });
        
        accumulatedWheelDeltaY = 0;
        accumulatedWheelDeltaX = 0;
      }

      videoWrapper.addEventListener('mousedown', (e) => {
        if (e.button === 1) return;
        
        showClickIndicator(e.clientX, e.clientY);
        flushMouseDelta();
        flushWheelAccumulated();
        
        if (!matrixTransformer) return;
        
        const containerRect = videoContainer.getBoundingClientRect();
        const localX = e.clientX - containerRect.left;
        const localY = e.clientY - containerRect.top;
        
        if (localX >= 0 && localX <= containerRect.width &&
            localY >= 0 && localY <= containerRect.height) {
          const ratioX = localX / containerRect.width;
          const ratioY = localY / containerRect.height;
          
          isMouseDownOnVideo = true;
          lastMoveX = ratioX;
          lastMoveY = ratioY;
          
          const inputData = {
            inputType: 'mousedown',
            button: e.button,
            x: Math.max(0, Math.min(1, ratioX)),
            y: Math.max(0, Math.min(1, ratioY))
          };
          connectionManager.sendInput(inputData);
        }
      });

      videoWrapper.addEventListener('mousemove', (e) => {
        if (isDragging) return;
        if (!matrixTransformer) return;
        
        if (idleTimer) {
          clearTimeout(idleTimer);
          idleTimer = null;
        }
        
        const containerRect = videoContainer.getBoundingClientRect();
        const localX = e.clientX - containerRect.left;
        const localY = e.clientY - containerRect.top;
        
        const ratioX = localX / containerRect.width;
        const ratioY = localY / containerRect.height;
        
        const currentX = ratioX;
        const currentY = ratioY;
        
        const now = Date.now();
        const timeSinceLastMove = now - lastMoveTime;
        const distance = Math.sqrt(
          Math.pow(currentX - lastMoveX, 2) + Math.pow(currentY - lastMoveY, 2)
        );
        
        const remoteDeltaX = (currentX - lastMoveX) * matrixTransformer.remoteScreenWidth;
        const remoteDeltaY = (currentY - lastMoveY) * matrixTransformer.remoteScreenHeight;
        
        accumulatedDeltaX += remoteDeltaX;
        accumulatedDeltaY += remoteDeltaY;
        
        lastMoveX = currentX;
        lastMoveY = currentY;
        
        if (timeSinceLastMove >= MOUSE_MOVE_CONFIG.MIN_INTERVAL_MS && 
            distance >= MOUSE_MOVE_CONFIG.MIN_DISTANCE_PX) {
          flushMouseDelta();
        }
        
        if (!moveSendTimer) {
          moveSendTimer = setInterval(() => {
            if (accumulatedDeltaX !== 0 || accumulatedDeltaY !== 0) {
              flushMouseDelta();
            }
          }, MOUSE_MOVE_CONFIG.MIN_INTERVAL_MS);
        }
        
        idleTimer = setTimeout(() => {
          if (accumulatedDeltaX !== 0 || accumulatedDeltaY !== 0) {
            flushMouseDelta();
          }
          idleTimer = null;
        }, MOUSE_MOVE_CONFIG.IDLE_TIMEOUT_MS);
      });

      videoWrapper.addEventListener('mouseup', (e) => {
        if (e.button === 1) return;
        
        flushMouseDelta();
        flushWheelAccumulated();
        
        if (!isMouseDownOnVideo || !matrixTransformer) return;
        
        isMouseDownOnVideo = false;
        
        const containerRect = videoContainer.getBoundingClientRect();
        let localX = e.clientX - containerRect.left;
        let localY = e.clientY - containerRect.top;
        
        localX = Math.max(0, Math.min(containerRect.width, localX));
        localY = Math.max(0, Math.min(containerRect.height, localY));
        
        const ratioX = localX / containerRect.width;
        const ratioY = localY / containerRect.height;
        
        connectionManager.sendInput({
          inputType: 'mouseup',
          button: e.button,
          x: ratioX,
          y: ratioY
        });
      });

      videoWrapper.addEventListener('wheel', (e) => {
        if (e.ctrlKey || e.metaKey) {
          e.preventDefault();
          return;
        }
        
        e.preventDefault();
        
        if (!matrixTransformer) return;
        
        const containerRect = videoContainer.getBoundingClientRect();
        const localX = e.clientX - containerRect.left;
        const localY = e.clientY - containerRect.top;
        
        const ratioX = localX / containerRect.width;
        const ratioY = localY / containerRect.height;
        
        accumulatedWheelDeltaY += e.deltaY;
        accumulatedWheelDeltaX += e.deltaX || 0;
        
        if (wheelSendTimer) {
          clearTimeout(wheelSendTimer);
        }
        
        wheelSendTimer = setTimeout(() => {
          if (accumulatedWheelDeltaY !== 0 || accumulatedWheelDeltaX !== 0) {
            connectionManager.sendInput({
              inputType: 'wheel_batch',
              accumulatedDeltaY: accumulatedWheelDeltaY,
              accumulatedDeltaX: accumulatedWheelDeltaX,
              x: ratioX,
              y: ratioY
            });
            accumulatedWheelDeltaY = 0;
            accumulatedWheelDeltaX = 0;
          }
          wheelSendTimer = null;
        }, WHEEL_BATCH_INTERVAL_MS);
      }, { passive: false });

      videoWrapper.addEventListener('mouseleave', () => {
        isMouseDownOnVideo = false;
      });

      videoWrapper.addEventListener('contextmenu', (e) => {
        e.preventDefault();
      });

      videoWrapper.addEventListener('keydown', (e) => {
        if (shouldBlockShortcut(e)) {
          e.preventDefault();
          return;
        }
        
        e.preventDefault();
        
        const inputData = {
          inputType: 'keydown',
          key: e.key,
          code: e.code,
          keyCode: e.keyCode,
          ctrlKey: e.ctrlKey,
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          metaKey: e.metaKey
        };
        connectionManager.sendInput(inputData);
      });

      videoWrapper.addEventListener('keyup', (e) => {
        if (shouldBlockShortcut(e)) {
          e.preventDefault();
          return;
        }
        
        e.preventDefault();
        
        const inputData = {
          inputType: 'keyup',
          key: e.key,
          code: e.code,
          keyCode: e.keyCode,
          ctrlKey: e.ctrlKey,
          shiftKey: e.shiftKey,
          altKey: e.altKey,
          metaKey: e.metaKey
        };
        connectionManager.sendInput(inputData);
      });

      let isUnlockPanelOpen = false;
      videoWrapper.setAttribute('tabindex', '0');
      videoWrapper.focus();
      
      // 确保 videoWrapper 持续保持焦点（但解锁面板打开时除外）
      videoWrapper.addEventListener('blur', () => {
        setTimeout(() => {
          if (videoWrapper && !isUnlockPanelOpen) {
            videoWrapper.focus();
          }
        }, 10);
      });
      
      // 暴露给 UnlockUI 使用的函数
      window.setUnlockPanelState = function(open) {
        isUnlockPanelOpen = open;
      };
      
      // 点击时确保焦点在 videoWrapper
      videoWrapper.addEventListener('click', () => {
        videoWrapper.focus();
      });
      
      const resolutionSelect = document.getElementById('resolutionSelect');
      if (resolutionSelect) {
        resolutionSelect.addEventListener('change', (e) => {
          const value = e.target.value;
          if (value === 'auto' || !connectionManager || !connectionManager.dataChannelManager || 
              !connectionManager.dataChannelManager.isOpen()) {
            return;
          }
          const [w, h] = value.split('x').map(Number);
          connectionManager.dataChannelManager.send({
            type: 'resolution-change',
            width: w,
            height: h
          });
          log('请求分辨率变更: ' + w + 'x' + h);
        });
      }
    }

    function setupTouchEvents() {
      let touchStartDistance = 0;
      let touchStartScale = 1;
      let touchStartX = 0;
      let touchStartY = 0;
      let touchStartPanX = 0;
      let touchStartPanY = 0;
      
      function getTouchDistance(touches) {
        const dx = touches[0].clientX - touches[1].clientX;
        const dy = touches[0].clientY - touches[1].clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
      
      function getTouchCenter(touches) {
        return {
          x: (touches[0].clientX + touches[1].clientX) / 2,
          y: (touches[0].clientY + touches[1].clientY) / 2
        };
      }
      
      remoteScreenEl.addEventListener('touchstart', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          touchStartDistance = getTouchDistance(e.touches);
          touchStartScale = matrixTransformer.scale;
          const center = getTouchCenter(e.touches);
          touchStartX = center.x;
          touchStartY = center.y;
          touchStartPanX = matrixTransformer.panX;
          touchStartPanY = matrixTransformer.panY;
        } else if (e.touches.length === 1) {
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
          touchStartPanX = matrixTransformer.panX;
          touchStartPanY = matrixTransformer.panY;
        }
      }, { passive: false });
      
      remoteScreenEl.addEventListener('touchmove', (e) => {
        if (e.touches.length === 2) {
          e.preventDefault();
          
          const currentDistance = getTouchDistance(e.touches);
          const scale = touchStartScale * (currentDistance / touchStartDistance);
          const clampedScale = Math.max(0.5, Math.min(3.0, scale));
          
          matrixTransformer.scale = clampedScale;
          matrixTransformer._matrixDirty = true;
          matrixTransformer.applyTransform(remoteScreenEl);
          
        } else if (e.touches.length === 1) {
          e.preventDefault();
          
          const deltaX = e.touches[0].clientX - touchStartX;
          const deltaY = e.touches[0].clientY - touchStartY;
          
          matrixTransformer.panX = touchStartPanX + deltaX;
          matrixTransformer.panY = touchStartPanY + deltaY;
          matrixTransformer._matrixDirty = true;
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }, { passive: false });
    }

    function setupPerformanceMonitor() {
      const stats = {
        fps: 0,
        frameCount: 0,
        lastTime: performance.now(),
        latency: 0,
        bytesReceived: 0,
        packetsLost: 0
      };
      
      function updateStats() {
        const now = performance.now();
        const elapsed = (now - stats.lastTime) / 1000;
        
        if (elapsed >= 1) {
          stats.fps = Math.round(stats.frameCount / elapsed);
          stats.frameCount = 0;
          stats.lastTime = now;
          
          document.getElementById('fps').textContent = stats.fps + ' fps';
        }
        
        requestAnimationFrame(updateStats);
      }
      
      if (videoElement) {
        videoElement.addEventListener('timeupdate', () => {
          stats.frameCount++;
        });
      }
      
      setInterval(async () => {
        if (connectionManager && connectionManager.peerConnection) {
          const stats2 = await connectionManager.peerConnection.getStats();
          stats2.forEach(report => {
            if (report.type === 'inbound-rtp' && report.kind === 'video') {
              stats.bytesReceived = report.bytesReceived || 0;
              stats.packetsLost = report.packetsLost || 0;
            }
          });
        }
      }, 1000);
      
      updateStats();
    }

    async function init() {
      if (window.isInitialized) {
        log('远程窗口已初始化，忽略重复调用');
        return;
      }
      window.isInitialized = true;
      
      videoElement = document.getElementById('screenVideo');
      videoContainer = document.getElementById('videoContainer');
      videoWrapper = document.getElementById('videoWrapper');
      remoteScreenEl = document.getElementById('remoteScreen');
      
      var optimizedCanvas = document.getElementById('optimizedCanvas');
      if (optimizedCanvas && typeof RemoteVideoHandler !== 'undefined') {
        remoteVideoHandler = new RemoteVideoHandler({
          logger: { log: log.bind(this), error: console.error },
          useOptimizedTransfer: true
        })
        log('RemoteVideoHandler 已创建')
      }
      
      log('远程窗口初始化开始');
      
      setupMatrixTransformer();
      setupPanZoomEvents();
      setupTouchEvents();
      setupPerformanceMonitor();
      
      window.electronAPI.on('signaling-mode-start', async (data) => {
        if (connectionManager) {
          log('连接管理器已存在，忽略重复的启动信号');
          return;
        }
        connectionMode = 'signaling';
        
        connectionManager = new SignalingConnectionManager();
        connectionManager.isController = (data.role === 'controller');
        connectionManager.targetDeviceId = data.targetDeviceId;
        window.connectionManager = connectionManager;
        setupConnectionManagerEvents();
        
        connectionManager.setVideoElements(videoElement, videoContainer, videoWrapper, remoteScreenEl);
        connectionManager.setMatrixTransformer(matrixTransformer);
        
        window.electronAPI.on('signaling-offer', (offerData) => {
          if (connectionManager) {
            connectionManager.handleSignalingOffer(offerData);
          }
        });
        
        window.electronAPI.on('signaling-answer', (answerData) => {
          if (connectionManager) {
            connectionManager.handleAnswer(answerData.answer);
          }
        });
        
        window.electronAPI.on('signaling-ice-candidate', (candidateData) => {
          if (connectionManager) {
            connectionManager.handleIceCandidate(candidateData.candidate);
          }
        });
        
        try {
          await connectionManager.connect({
            credentials: {
              deviceId: data.deviceId,
              sessionId: data.sessionId
            }
          });
          
          if (!inputEventsSetup && connectionManager.isController) {
            log('兜底调用 setupInputEvents');
            setupInputEvents();
          }
        } catch (error) {
          log('信令模式连接失败: ' + error.message);
          updateStatus('连接失败', 'error');
        }
      });
      
      window.electronAPI.on('direct-mode-start', async (data) => {
        if (connectionManager) return;
        
        connectionMode = 'direct';
        
        try {
          connectionManager = new DirectConnectionManager();
          
          connectionManager.setModeData(data);
          window.connectionManager = connectionManager;
          
          setupConnectionManagerEvents();
          
          connectionManager.setVideoElements(videoElement, videoContainer, videoWrapper, remoteScreenEl);
          
          connectionManager.setMatrixTransformer(matrixTransformer);
          
          await connectionManager.connect({});
          
          if (!inputEventsSetup) {
            log('兜底调用 setupInputEvents');
            setupInputEvents();
          }
        } catch (error) {
          log('直连模式连接失败: ' + error.message);
          console.error('连接错误详情:', error);
          updateStatus('连接失败', 'error');
        }
      });
      
      window.electronAPI.send('remote-window-ready', {});
      
      try {
        const screenSize = await window.electronAPI.getScreenSize();
        document.getElementById('resolution').textContent = `${screenSize.width}x${screenSize.height}`;
      } catch (error) {
        log('获取屏幕尺寸失败: ' + error.message);
      }
      
      updateStatus('正在连接...');
      showPlaceholder('正在建立连接...', '请稍候');
    }

    function setupConnectionManagerEvents() {
      connectionManager.on('log', (message) => {
        log(message);
      });
      
      connectionManager.on('error', (data) => {
        log('错误: ' + data.message);
        updateStatus('连接错误', 'error');
      });
      
      connectionManager.on('latency', (latency) => {
        document.getElementById('latency').textContent = `${latency} ms`;
      });
      
      connectionManager.on('video-metadata', (data) => {
        log('video-metadata 事件触发');
        showVideo();
        updateStatus('已连接');
        requestAnimationFrame(onVideoFrame);
        setupInputEvents();
        connectionManager.startLatencyCheck();
      });
      
      connectionManager.on('video-ready', () => {
      });
      
      connectionManager.on('data-channel-open', () => {
        initAuxiliaryChannels();
        initOptimizedVideoChannel();
      });
      
      connectionManager.on('auxiliary-channel-ready', (data) => {
      });
      
      connectionManager.on('auxiliary-channel-error', (data) => {
      });
      
      connectionManager.stateMachine.addListener((newState, oldState, data) => {
        document.getElementById('connectionState').textContent = newState;
        
        switch (newState) {
          case 'connecting':
            updateStatus('正在连接...', 'connecting');
            showPlaceholder('正在建立连接...', '请稍候');
            break;
          case 'authenticating':
            showPlaceholder('正在验证身份...', '请稍候');
            break;
          case 'resolution-negotiating':
            showPlaceholder('正在协商分辨率...', '请稍候');
            break;
          case 'waiting-video':
            showPlaceholder('等待视频流...', '请稍候');
            break;
          case 'connected':
            updateStatus('已连接');
            break;
          case 'error':
            updateStatus('连接失败', 'error');
            showPlaceholder('连接失败', data?.error || '未知错误');
            break;
        }
      });
    }
    
    function initOptimizedVideoChannel() {
      if (!remoteVideoHandler || !connectionManager || !connectionManager.peerConnection) return

      var optimizedCanvas = document.getElementById('optimizedCanvas')
      if (!optimizedCanvas) return

      remoteVideoHandler.initialize(videoElement, optimizedCanvas, connectionManager.peerConnection)

      connectionManager.peerConnection.ondatachannel = function(event) {
        var channel = event.channel
        if (channel.label === 'optimized-video') {
          log('收到优化视频数据通道')
          remoteVideoHandler.setupDataChannel(channel)
        }
      }

      log('优化视频通道初始化完成')
    }

    function initAuxiliaryChannels() {
      auxiliaryChannelManager = new AuxiliaryChannelManager({ logger: { log: log, error: console.error } });
      auxiliaryChannelManager.setPeerConnection(connectionManager.peerConnection);
      auxiliaryChannelManager.setDataChannelManager(connectionManager.dataChannelManager);
      
      fallbackHandler = new FallbackHandler({ logger: { log: log, error: console.error } });
      fallbackHandler.setAuxiliaryChannelManager(auxiliaryChannelManager);
      
      auxiliaryChannelManager.on('channel-ready', (data) => {
        updateAuxiliaryStatus(data.type, 'ready');
      });
      
      auxiliaryChannelManager.on('channel-closed', (data) => {
        updateAuxiliaryStatus(data.type, 'closed');
      });
      
      auxiliaryChannelManager.on('clipboard-sync', (content) => {
        handleClipboardSync(content);
      });
      
      fallbackHandler.on('user-notification', (notification) => {
        showUserNotification(notification);
      });
      
      fallbackHandler.on('fallback-executed', (data) => {
        updateAuxiliaryStatus(data.channelType, 'fallback');
      });
      
      fallbackHandler.on('retry-success', (data) => {
        updateAuxiliaryStatus(data.channelType, 'ready');
      });
    }
    
    function loadAuxiliaryChannelsAsync() {
      if (!auxiliaryChannelManager) {
        return;
      }
      
      auxiliaryChannelManager.loadAllParallel([
        AuxiliaryChannelType.CLIPBOARD
      ]).then(result => {
      });
    }
    
    function updateAuxiliaryStatus(channelType, status) {
      const statusEl = document.getElementById('auxiliaryStatus');
      if (statusEl) {
        const statuses = JSON.parse(statusEl.textContent || '{}');
        statuses[channelType] = status;
        statusEl.textContent = JSON.stringify(statuses);
      }
    }
    
    function handleClipboardSync(content) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(content).then(() => {
        }).catch(err => {
          log('剪贴板同步失败: ' + err.message);
        });
      }
    }
    
    function showUserNotification(notification) {
      
      const notificationEl = document.createElement('div');
      notificationEl.className = `notification notification-${notification.severity}`;
      notificationEl.innerHTML = `
        <span class="notification-message">${notification.message}</span>
        <button class="notification-dismiss" onclick="this.parentElement.remove()">×</button>
      `;
      notificationEl.style.cssText = `
        position: fixed;
        bottom: 80px;
        left: 50%;
        transform: translateX(-50%);
        background: ${notification.severity === 'warning' ? '#ff9800' : '#2196f3'};
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        z-index: 10000;
        display: flex;
        align-items: center;
        gap: 10px;
      `;
      
      document.body.appendChild(notificationEl);
      
      setTimeout(() => {
        notificationEl.remove();
      }, 5000);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && document.fullscreenElement) {
        document.exitFullscreen();
      }
      
      if (e.ctrlKey && e.key === '0') {
        e.preventDefault();
        if (matrixTransformer) {
          matrixTransformer.resetView();
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }
      
      if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        if (matrixTransformer) {
          matrixTransformer.resetView();
          matrixTransformer.applyTransform(remoteScreenEl);
        }
      }
      
      if (e.key === 'F11') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    init();
  </script>

  <!-- 解锁面板 UI -->
  <div id="unlockOverlay" class="hidden">
    <div class="unlock-dialog">
      <h2>远程电脑已锁定</h2>
      <p>请输入密码以解锁远程电脑</p>
      
      <div class="unlock-input-group">
        <label for="unlockPassword">密码</label>
        <input type="password" id="unlockPassword" class="unlock-input" placeholder="输入解锁密码">
      </div>
      
      <div class="unlock-remember-group">
        <input type="checkbox" id="rememberUnlockPassword">
        <label for="rememberUnlockPassword">记住密码（加密存储）</label>
      </div>
      
      <div class="unlock-buttons">
        <button class="unlock-btn unlock-btn-primary" id="btnManualUnlock">解锁</button>
        <button class="unlock-btn unlock-btn-secondary" id="btnAutoUnlock" style="display: none;">自动解锁</button>
      </div>
      
      <div id="unlockMessage" class="unlock-message"></div>
    </div>
  </div>

  <script>
    class UnlockUI {
      constructor() {
        this.overlay = document.getElementById('unlockOverlay');
        this.passwordInput = document.getElementById('unlockPassword');
        this.rememberCheckbox = document.getElementById('rememberUnlockPassword');
        this.manualBtn = document.getElementById('btnManualUnlock');
        this.autoBtn = document.getElementById('btnAutoUnlock');
        this.messageEl = document.getElementById('unlockMessage');
        this.autoUnlockEnabled = false;
        this.savedPasswordAvailable = false;
        this.savedPassword = null;
        
        this.setupEventListeners();
        this.loadSavedPassword();
      }
      
      setupEventListeners() {
        this.manualBtn.addEventListener('click', () => this.handleManualUnlock());
        this.autoBtn.addEventListener('click', () => this.handleAutoUnlock());
        
        this.passwordInput.addEventListener('keypress', (e) => {
          if (e.key === 'Enter') {
            this.handleManualUnlock();
          }
        });
        
        this.rememberCheckbox.addEventListener('change', () => {
          this.handlePasswordSave();
        });
      }
      
      loadSavedPassword() {
        // 尝试从localStorage读取保存的密码
        try {
          const saved = localStorage.getItem('ycdesk_unlock_password');
          if (saved) {
            this.savedPassword = saved;
            this.savedPasswordAvailable = true;
            this.rememberCheckbox.checked = true;
          }
        } catch (e) {
          console.error('读取保存的密码失败', e);
        }
      }
      
      showOverlay() {
        this.overlay.classList.remove('hidden');
        
        // 告诉 videoWrapper 不要强制抢焦点
        if (window.setUnlockPanelState) {
          window.setUnlockPanelState(true);
        }
        
        // 稍微延迟一下再聚焦，确保 overlay 已经渲染
        setTimeout(() => {
          this.passwordInput.focus();
        }, 50);
        
        if (this.savedPasswordAvailable) {
          this.autoBtn.style.display = 'block';
        } else {
          this.autoBtn.style.display = 'none';
        }
      }
      
      hideOverlay() {
        this.overlay.classList.add('hidden');
        this.passwordInput.value = '';
        this.clearMessage();
        
        // 告诉 videoWrapper 可以恢复抢焦点了
        if (window.setUnlockPanelState) {
          window.setUnlockPanelState(false);
        }
      }
      
      async handleManualUnlock() {
        const password = this.passwordInput.value;
        
        if (!password) {
          this.showMessage('请输入密码', 'error');
          return;
        }
        
        // 发送解锁命令
        try {
          this.sendUnlockCommand(password);
          this.showMessage('正在发送解锁命令...', 'success');
          
          // 保存密码
          if (this.rememberCheckbox.checked) {
            this.savePassword(password);
          }
          
          setTimeout(() => this.hideOverlay(), 1500);
        } catch (error) {
          this.showMessage('发送解锁命令失败: ' + error.message, 'error');
        }
      }
      
      async handleAutoUnlock() {
        if (!this.savedPassword) {
          this.showMessage('没有保存的密码', 'error');
          return;
        }
        
        // 使用保存的密码
        try {
          this.sendUnlockCommand(this.savedPassword);
          this.showMessage('正在发送自动解锁命令...', 'success');
          setTimeout(() => this.hideOverlay(), 1500);
        } catch (error) {
          this.showMessage('自动解锁失败: ' + error.message, 'error');
          this.autoBtn.style.display = 'none';
        }
      }
      
      sendUnlockCommand(password) {
        if (!window.connectionManager) {
          throw new Error('连接管理器未初始化');
        }
        
        console.log('[UnlockUI] 发送解锁命令，密码长度:', password.length);
        
        let unlockCommand;
        
        // 尝试使用 createInputCommand
        if (window.createInputCommand && typeof window.createInputCommand === 'function') {
          try {
            unlockCommand = window.createInputCommand('unlock_screen', {
              password: password
            });
            console.log('[UnlockUI] 使用 createInputCommand 构造命令:', unlockCommand);
          } catch (e) {
            console.warn('[UnlockUI] createInputCommand 失败，使用备用方案:', e.message);
            // 备用方案：直接构造标准格式的命令
            unlockCommand = {
              type: 'input',
              inputType: 'unlock_screen',
              password: password,
              timestamp: Date.now()
            };
          }
        } else {
          console.warn('[UnlockUI] window.createInputCommand 未找到，使用备用方案');
          // 备用方案
          unlockCommand = {
            type: 'input',
            inputType: 'unlock_screen',
            password: password,
            timestamp: Date.now()
          };
        }
        
        console.log('[UnlockUI] 发送解锁命令:', unlockCommand);
        
        // 发送命令
        window.connectionManager.sendInput(unlockCommand);
      }
      
      savePassword(password) {
        try {
          localStorage.setItem('ycdesk_unlock_password', password);
          this.savedPassword = password;
          this.savedPasswordAvailable = true;
        } catch (e) {
          console.error('保存密码失败', e);
        }
      }
      
      handlePasswordSave() {
        if (!this.rememberCheckbox.checked) {
          this.clearPassword();
        } else if (this.passwordInput.value) {
          this.savePassword(this.passwordInput.value);
        }
      }
      
      clearPassword() {
        try {
          localStorage.removeItem('ycdesk_unlock_password');
          this.savedPassword = null;
          this.savedPasswordAvailable = false;
        } catch (e) {
          console.error('清除密码失败', e);
        }
      }
      
      showMessage(text, type) {
        this.messageEl.textContent = text;
        this.messageEl.className = 'unlock-message ' + type;
      }
      
      clearMessage() {
        this.messageEl.textContent = '';
        this.messageEl.className = 'unlock-message';
      }
    }
    
    // 全局解锁 UI 实例
    let unlockUI = null;
    
    // 暴露打开解锁面板的全局函数
    window.openUnlockPanel = function() {
      if (unlockUI) {
        unlockUI.showOverlay();
      }
    };
    
    // 初始化解锁 UI
    document.addEventListener('DOMContentLoaded', () => {
      unlockUI = new UnlockUI();
    });
  </script>
</body>
</html>
